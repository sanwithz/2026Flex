<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>LINE Flex Studio</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #06c755;
      --brand: #087b40;
      --bg: #f5f7f6;
      --card: #ffffff;
      --surface: #f9fbfa;
      --border: #dfe6e2;
      --text: #17211c;
      --muted: #718078;
      --danger: #d92d20;
      --blue: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    header {
      min-height: 68px;
      background: #fff;
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
      padding: 12px 20px;

      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
    }

    .brand small {
      color: var(--muted);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 13px;
      color: var(--muted);
    }

    .user-avatar {
      width: 34px;
      height: 34px;

      border-radius: 50%;
      object-fit: cover;

      background: #edf2ef;
    }

    .api-dot {
      width: 8px;
      height: 8px;

      display: inline-block;
      border-radius: 50%;

      background: #aaa;
    }

    .api-dot.online {
      background: #06c755;
    }

    .api-dot.offline {
      background: #d92d20;
    }

    /* =========================================================
       LAYOUT
    ========================================================= */

    .app {
      display: grid;

      grid-template-columns:
        260px
        minmax(420px, 1fr)
        380px;

      gap: 14px;
      padding: 14px;

      min-height: calc(100vh - 68px);
    }

    .panel {
      background: #fff;

      border: 1px solid var(--border);
      border-radius: 12px;

      overflow: hidden;
    }

    .panel-header {
      min-height: 52px;

      padding: 12px 14px;

      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      font-weight: 700;
    }

    .panel-body {
      padding: 14px;
    }

    /* =========================================================
       BUTTONS
    ========================================================= */

    button {
      border: 0;
      border-radius: 7px;

      padding: 9px 12px;

      cursor: pointer;

      font-weight: 600;
      font-size: 13px;

      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-dark {
      background: #17211c;
      color: #fff;
    }

    .btn-light {
      background: #eef3f0;
      color: #24352c;
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
    }

    .btn-danger {
      background: #fff1f0;
      color: var(--danger);
    }

    .btn-small {
      padding: 6px 8px;
      font-size: 12px;
    }

    /* =========================================================
       FORM
    ========================================================= */

    label {
      display: block;

      font-size: 12px;
      font-weight: 650;

      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid var(--border);
      border-radius: 7px;

      padding: 9px 10px;

      background: #fff;
      color: var(--text);

      font-size: 13px;

      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    .field {
      margin-bottom: 12px;
    }

    /* =========================================================
       TEMPLATE LIBRARY
    ========================================================= */

    .template-search {
      margin-bottom: 10px;
    }

    .template-list {
      max-height: calc(100vh - 230px);
      overflow-y: auto;
    }

    .template-item {
      padding: 10px;

      border: 1px solid var(--border);
      border-radius: 8px;

      margin-bottom: 7px;

      cursor: pointer;
    }

    .template-item:hover,
    .template-item.active {
      border-color: var(--primary);
      background: #f1fff6;
    }

    .template-name {
      font-weight: 650;
      font-size: 13px;

      word-break: break-word;
    }

    .template-date {
      margin-top: 4px;

      font-size: 10px;
      color: var(--muted);
    }

    .empty-state {
      text-align: center;

      font-size: 12px;
      color: var(--muted);

      padding: 25px 8px;
    }

    /* =========================================================
       EDITOR
    ========================================================= */

    .editor-toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .metadata {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      padding: 14px;

      border-bottom: 1px solid var(--border);
    }

    .component-toolbar {
      padding: 10px 14px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 6px;

      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    /* =========================================================
       DESIGN AREA
    ========================================================= */

    .design-area {
      display: grid;
      grid-template-columns: 230px 1fr;

      min-height: 650px;
    }

    /* =========================================================
       TREE
    ========================================================= */

    .tree-area {
      border-right: 1px solid var(--border);

      padding: 12px;

      overflow: auto;

      max-height: calc(100vh - 270px);
    }

    .tree-title {
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;

      margin-bottom: 10px;

      color: var(--muted);
    }

    .tree-row {
      font-size: 12px;

      padding: 6px 7px;

      cursor: pointer;

      border-radius: 6px;

      margin-bottom: 2px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tree-row:hover {
      background: #f2f5f3;
    }

    .tree-row.selected {
      background: #e7f8ed;
      color: var(--brand);

      font-weight: 700;
    }

    /* =========================================================
       PREVIEW
    ========================================================= */

    .preview-area {
      background:
        radial-gradient(
          circle at 1px 1px,
          #dfe5e1 1px,
          transparent 1px
        );

      background-size: 18px 18px;

      padding: 30px;

      overflow: auto;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .flex-preview {
      width: 350px;

      min-height: 120px;

      background: #fff;

      border-radius: 15px;

      overflow: hidden;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12);

      flex-shrink: 0;
    }

    .preview-box {
      display: flex;

      min-width: 0;

      box-sizing: border-box;

      position: relative;
    }

    .preview-element {
      cursor: pointer;
      position: relative;
    }

    .preview-element.selected-element {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* =========================================================
       INSPECTOR
    ========================================================= */

    .inspector {
      max-height: calc(100vh - 96px);
      overflow-y: auto;
    }

    .inspector-section {
      padding: 14px;

      border-bottom: 1px solid var(--border);
    }

    .inspector-section h3 {
      font-size: 13px;

      margin: 0 0 12px;
    }

    .element-type {
      display: inline-block;

      padding: 4px 8px;

      border-radius: 50px;

      background: #eaf8ef;
      color: var(--brand);

      font-size: 11px;
      font-weight: 700;

      margin-bottom: 12px;
    }

    #jsonEditor,
    #elementJsonEditor {
      font-family:
        "SFMono-Regular",
        Consolas,
        Monaco,
        monospace;

      line-height: 1.5;
      font-size: 12px;

      resize: vertical;
    }

    #jsonEditor {
      height: 360px;
    }

    #elementJsonEditor {
      height: 200px;
    }

    /* =========================================================
       STATUS
    ========================================================= */

    .status {
      position: fixed;

      bottom: 15px;
      right: 15px;

      max-width: 420px;

      background: #17211c;
      color: #fff;

      border-radius: 8px;

      padding: 10px 14px;

      font-size: 12px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.2);

      z-index: 999;

      display: none;
    }

    .status.success {
      background: var(--brand);
    }

    .status.error {
      background: #b42318;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1150px) {
      .app {
        grid-template-columns: 220px 1fr;
      }

      .inspector {
        grid-column: 1 / -1;
        max-height: none;
      }
    }

    @media (max-width: 780px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .metadata {
        grid-template-columns: 1fr;
      }

      .design-area {
        grid-template-columns: 1fr;
      }

      .tree-area {
        border-right: 0;
        border-bottom: 1px solid var(--border);

        max-height: 220px;
      }

      .preview-area {
        padding: 20px 5px;
      }

      .flex-preview {
        width: min(350px, 94vw);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <h1>LINE Flex Studio</h1>
    <small>Visual Designer · JSON · Google Sheet Templates</small>
  </div>

  <div
    id="userInfo"
    class="user-info"
  >
    <span
      id="apiDot"
      class="api-dot"
      title="Apps Script API"
    ></span>

    <span>Connecting...</span>
  </div>
</header>


<div class="app">

  <!-- =======================================================
       TEMPLATE LIBRARY
  ======================================================== -->

  <section class="panel">

    <div class="panel-header">
      <span>Template Library</span>

      <button
        class="btn-light btn-small"
        onclick="newTemplate()"
      >
        + New
      </button>
    </div>


    <div class="panel-body">

      <input
        id="searchInput"
        class="template-search"
        placeholder="Search templates..."
        oninput="renderTemplateList()"
      />


      <div
        id="templateList"
        class="template-list"
      >
        <div class="empty-state">
          Loading...
        </div>
      </div>

    </div>

  </section>


  <!-- =======================================================
       FLEX DESIGNER
  ======================================================== -->

  <section class="panel">

    <div class="panel-header">

      <span>Flex Designer</span>


      <div class="editor-toolbar">

        <button
          class="btn-light"
          onclick="newTemplate()"
        >
          New
        </button>

        <button
          class="btn-primary"
          onclick="saveCurrentTemplate()"
        >
          Save
        </button>

        <button
          class="btn-light"
          onclick="duplicateTemplate()"
        >
          Duplicate
        </button>

        <button
          class="btn-danger"
          onclick="deleteCurrentTemplate()"
        >
          Delete
        </button>

        <button
          class="btn-dark"
          onclick="shareFlex()"
        >
          Share LINE
        </button>

      </div>

    </div>


    <div class="metadata">

      <div>
        <label>Template Name</label>

        <input
          id="templateName"
          placeholder="Bhumibol Dam"
        />
      </div>


      <div>
        <label>LINE altText</label>

        <input
          id="altText"
          value="Flex Message"
          maxlength="400"
        />
      </div>

    </div>


    <div class="component-toolbar">

      <button
        class="btn-light"
        onclick="addComponent('text')"
      >
        + Text
      </button>

      <button
        class="btn-light"
        onclick="addComponent('image')"
      >
        + Image
      </button>

      <button
        class="btn-light"
        onclick="addComponent('button')"
      >
        + Button
      </button>

      <button
        class="btn-light"
        onclick="addComponent('box')"
      >
        + Box
      </button>

      <button
        class="btn-light"
        onclick="addComponent('separator')"
      >
        + Separator
      </button>

      <button
        class="btn-light"
        onclick="addComponent('spacer')"
      >
        + Spacer
      </button>

      <button
        class="btn-blue"
        onclick="addBubble()"
      >
        + Bubble
      </button>


      <span style="flex:1"></span>


      <button
        class="btn-light"
        onclick="moveSelected(-1)"
        title="Move Up"
      >
        ↑
      </button>

      <button
        class="btn-light"
        onclick="moveSelected(1)"
        title="Move Down"
      >
        ↓
      </button>

      <button
        class="btn-light"
        onclick="duplicateSelected()"
      >
        Copy
      </button>

      <button
        class="btn-danger"
        onclick="removeSelected()"
      >
        Remove
      </button>

    </div>


    <div class="design-area">

      <div class="tree-area">
        <div class="tree-title">
          STRUCTURE
        </div>

        <div id="structureTree"></div>
      </div>


      <div class="preview-area">
        <div id="previewRoot"></div>
      </div>

    </div>

  </section>


  <!-- =======================================================
       INSPECTOR
  ======================================================== -->

  <section class="panel inspector">

    <div class="panel-header">
      <span>Properties</span>
    </div>


    <div
      id="propertyEditor"
      class="inspector-section"
    ></div>


    <div class="inspector-section">

      <h3>Selected Element JSON</h3>

      <textarea
        id="elementJsonEditor"
      ></textarea>

      <button
        style="margin-top:8px"
        class="btn-light"
        onclick="applyElementJson()"
      >
        Apply Element JSON
      </button>

    </div>


    <div class="inspector-section">

      <h3>Full Flex JSON</h3>

      <textarea
        id="jsonEditor"
        oninput="jsonDirty=true"
      ></textarea>


      <div
        style="
          display:flex;
          gap:6px;
          flex-wrap:wrap;
          margin-top:8px;
        "
      >
        <button
          class="btn-blue"
          onclick="applyFullJson()"
        >
          Apply JSON
        </button>

        <button
          class="btn-light"
          onclick="formatFullJson()"
        >
          Format
        </button>

        <button
          class="btn-light"
          onclick="copyFullJson()"
        >
          Copy
        </button>
      </div>

    </div>

  </section>

</div>


<div
  id="status"
  class="status"
></div>


<script>

/* ============================================================
   CONFIG
============================================================ */

const LIFF_ID =
  "2007125937-fXcIzxO8";


const API_URL =
  "https://script.google.com/macros/s/AKfycbxbTeH8bm8w8qTWo0-DO9fKGJa2BsAGmi2fVUUJ3omfOQ0bT5S-c6A7By8PnmcYlCpucg/exec";


/* ============================================================
   STATE
============================================================ */

let currentTemplateId = null;

let templates = [];

let jsonDirty = false;

let apiOnline = false;


let lineUser = {
  id: "anonymous",
  name: "LINE User",
  pictureUrl: ""
};


/* ============================================================
   DEFAULT FLEX
   Your Bhumibol Dam Example
============================================================ */

function createDefaultBubble() {

  return {
  "type": "bubble",
  "body": {
    "type": "box",
    "layout": "vertical",
    "paddingAll": "24px",
    "spacing": "md",
    "contents": [
      {
        "type": "text",
        "text": "Hello, World!",
        "weight": "bold",
        "size": "xl",
        "wrap": true,
        "color": "#17211C"
      },
      {
        "type": "text",
        "text": "Edit this Flex Message visually.",
        "color": "#718078",
        "size": "sm",
        "wrap": true
      },
      {
        "type": "button",
        "style": "primary",
        "color": "#06C755",
        "margin": "md",
        "action": {
          "type": "uri",
          "label": "Open website",
          "uri": "https://line.me"
        }
      }
    ]
  }
};

}


let flexModel =
  createDefaultBubble();


let selectedPath =
  ["body"];


/* ============================================================
   APPS SCRIPT API
============================================================ */

async function apiRequest(body) {

  let response;


  // Add a nonce so every request is treated as fresh.
  // Code.gs can safely ignore this extra property.
  const requestBody = {
    ...body,
    _ts: Date.now()
  };


  try {

    response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(requestBody),

          redirect:
            "follow",

          cache:
            "no-store"
        }
      );

  }

  catch (error) {

    setApiStatus(false);

    throw new Error(
      "Cannot connect to Apps Script API: " +
      error.message
    );

  }


  if (!response.ok) {

    setApiStatus(false);

    throw new Error(
      `API HTTP Error ${response.status}`
    );

  }


  const raw =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(raw);

  }

  catch (error) {

    console.error(
      "Raw Apps Script response:",
      raw
    );


    setApiStatus(false);


    throw new Error(
      "Apps Script did not return valid JSON. " +
      "Check your Code.gs deployment."
    );

  }


  if (!result.success) {

    setApiStatus(false);

    throw new Error(
      result.error ||
      "Apps Script API error."
    );

  }


  setApiStatus(true);


  return result.data;

}


/* ============================================================
   API ROUTER
============================================================ */

async function server(
  method,
  ...args
) {

  switch (method) {

    case "getTemplates":

      return apiRequest({
        action: "getTemplates",
        ownerId: args[0]
      });


    case "getTemplate":

      return apiRequest({
        action: "getTemplate",
        id: args[0],
        ownerId: args[1]
      });


    case "saveTemplate":

      return apiRequest({
        action: "saveTemplate",
        payload: args[0]
      });


    case "deleteTemplate":

      return apiRequest({
        action: "deleteTemplate",
        id: args[0],
        ownerId: args[1]
      });


    case "ping":

      return apiRequest({
        action: "ping"
      });


    default:

      throw new Error(
        "Unknown API method: " +
        method
      );

  }

}


/* ============================================================
   API STATUS
============================================================ */

function setApiStatus(online) {

  apiOnline =
    online;


  const dot =
    document.getElementById(
      "apiDot"
    );


  if (!dot) {
    return;
  }


  dot.classList.remove(
    "online",
    "offline"
  );


  dot.classList.add(
    online
      ? "online"
      : "offline"
  );


  dot.title =
    online
      ? "Apps Script API Connected"
      : "Apps Script API Offline";

}


/* ============================================================
   TEST API
============================================================ */

async function testApi() {

  try {

    await server(
      "ping"
    );


    setApiStatus(
      true
    );


    return true;

  }

  catch (error) {

    console.error(
      "API ping:",
      error
    );


    setApiStatus(
      false
    );


    return false;

  }

}


/* ============================================================
   INIT
============================================================ */

async function init() {

  renderAll();


  await testApi();


  try {

    await liff.init({
      liffId:
        LIFF_ID
    });


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    await loadLineProfile();

    await loadTemplateList();

  }

  catch (error) {

    console.error(
      "LIFF:",
      error
    );


    showStatus(
      "LIFF initialization error: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   LINE PROFILE
============================================================ */

async function loadLineProfile() {

  try {

    const profile =
      await liff.getProfile();


    lineUser = {
      id:
        profile.userId,

      name:
        profile.displayName ||
        "LINE User",

      pictureUrl:
        profile.pictureUrl ||
        ""
    };

  }

  catch (error) {

    console.warn(
      error
    );


    try {

      const token =
        liff.getDecodedIDToken();


      if (
        token?.sub
      ) {

        lineUser.id =
          token.sub;

      }


      if (
        token?.name
      ) {

        lineUser.name =
          token.name;

      }

    }

    catch (_) {}

  }


  renderUser();

}


/* ============================================================
   RENDER USER
============================================================ */

function renderUser() {

  const root =
    document.getElementById(
      "userInfo"
    );


  root.innerHTML =
    "";


  const dot =
    document.createElement(
      "span"
    );


  dot.id =
    "apiDot";


  dot.className =
    "api-dot " +
    (
      apiOnline
        ? "online"
        : "offline"
    );


  root.appendChild(
    dot
  );


  if (
    lineUser.pictureUrl
  ) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "user-avatar";


    img.src =
      lineUser.pictureUrl;


    img.alt =
      lineUser.name;


    root.appendChild(
      img
    );

  }


  const text =
    document.createElement(
      "span"
    );


  text.textContent =
    lineUser.name;


  root.appendChild(
    text
  );

}


/* ============================================================
   TEMPLATE LIBRARY
============================================================ */

async function loadTemplateList(showLoading = false) {

  if (showLoading) {

    const list =
      document.getElementById(
        "templateList"
      );


    if (list) {

      list.innerHTML =
        `<div class="empty-state">Refreshing from Google Sheet...</div>`;

    }

  }


  try {

    templates =
      await server(
        "getTemplates",
        lineUser.id
      );


    if (
      !Array.isArray(
        templates
      )
    ) {

      templates = [];

    }


    renderTemplateList();

  }

  catch (error) {

    templates = [];


    renderTemplateList();


    showStatus(
      "Cannot load templates: " +
      error.message,
      "error"
    );

  }

}


function renderTemplateList() {

  const root =
    document.getElementById(
      "templateList"
    );


  root.innerHTML =
    "";


  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    templates.filter(
      template =>

        String(
          template.name ||
          ""
        )
          .toLowerCase()
          .includes(
            query
          )
    );


  if (
    !filtered.length
  ) {

    root.innerHTML =
      `
      <div class="empty-state">
        No templates
      </div>
      `;

    return;

  }


  filtered.forEach(
    template => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "template-item";


      if (
        template.id ===
        currentTemplateId
      ) {

        item.classList.add(
          "active"
        );

      }


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "template-name";


      name.textContent =
        template.name ||
        "Untitled";


      const date =
        document.createElement(
          "div"
        );


      date.className =
        "template-date";


      date.textContent =
        template.updatedAt ||
        "";


      item.appendChild(
        name
      );


      item.appendChild(
        date
      );


      item.onclick =
        () =>
          openTemplate(
            template.id
          );


      root.appendChild(
        item
      );

    }
  );

}


/* ============================================================
   OPEN TEMPLATE
============================================================ */

async function openTemplate(id) {

  try {

    showStatus(
      "Loading template..."
    );


    const data =
      await server(
        "getTemplate",
        id,
        lineUser.id
      );


    if (!data) {

      throw new Error(
        "Template data is empty."
      );

    }


    const parsed =
      JSON.parse(
        data.flexJson
      );


    validateFlex(
      parsed
    );


    flexModel =
      parsed;


    currentTemplateId =
      data.id;


    document.getElementById(
      "templateName"
    ).value =
      data.templateName ||
      "";


    document.getElementById(
      "altText"
    ).value =
      data.altText ||
      "Flex Message";


    selectedPath =
      getDefaultSelectionPath();


    jsonDirty =
      false;


    renderAll();

    renderTemplateList();


    showStatus(
      "Template loaded.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "Cannot load template: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   NEW TEMPLATE
============================================================ */

function newTemplate() {

  currentTemplateId =
    null;


  flexModel =
    createDefaultBubble();


  selectedPath =
    ["body"];


  jsonDirty =
    false;


  document.getElementById(
    "templateName"
  ).value =
    "";


  document.getElementById(
    "altText"
  ).value =
    "Flex Message";


  renderAll();

  renderTemplateList();


  showStatus(
    "New template."
  );

}


/* ============================================================
   SAVE TEMPLATE
============================================================ */

async function saveCurrentTemplate() {

  try {

    if (
      !commitJsonIfNeeded()
    ) {

      return;

    }


    validateFlex(
      flexModel
    );


    const templateName =
      document
        .getElementById(
          "templateName"
        )
        .value
        .trim();


    if (
      !templateName
    ) {

      throw new Error(
        "Please enter Template Name."
      );

    }


    const altText =
      document
        .getElementById(
          "altText"
        )
        .value
        .trim()
      ||
      "Flex Message";


    showStatus(
      "Saving..."
    );


    const result =
      await server(
        "saveTemplate",
        {
          id:
            currentTemplateId,

          ownerId:
            lineUser.id,

          ownerName:
            lineUser.name,

          templateName:
            templateName,

          altText:
            altText,

          flexJson:
            JSON.stringify(
              flexModel,
              null,
              2
            )
        }
      );


    currentTemplateId =
      result.id;


    await loadTemplateList();


    showStatus(
      result.mode === "created"
        ? "Template created."
        : "Template updated.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "Save failed: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   DUPLICATE TEMPLATE
============================================================ */

function duplicateTemplate() {

  currentTemplateId =

  const input =
    document.getElementById(

    );


  input.value =

    ) +

  );

/* ============================================================
   DELETE TEMPLATE
============================================================ */

async function deleteCurrentTemplate() {

  if (
    !currentTemplateId
  ) {

    showStatus(
      "This template has not been saved yet.",
      "error"
    );

    return;

  }


  const templateName =
    document
      .getElementById(
        "templateName"
      )
      .value
      .trim()
    ||
    "this template";


  const confirmResult =
    await Swal.fire({
      title: "Delete template?",
      html:
        `You are about to delete <b>${escapeHtml(templateName)}</b>.<br>` +
        `This action cannot be undone.`,
      icon: "warning",
      showCancelButton: true,
      confirmButtonText: "Delete",
      cancelButtonText: "Cancel",
      confirmButtonColor: "#D92D20",
      cancelButtonColor: "#64748B",
      reverseButtons: true,
      focusCancel: true
    });


  if (
    !confirmResult.isConfirmed
  ) {

    return;

  }


  try {

    Swal.fire({
      title: "Deleting...",
      text: "Updating Google Sheet and refreshing the template library.",
      allowOutsideClick: false,
      allowEscapeKey: false,
      showConfirmButton: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });


    await server(
      "deleteTemplate",
      currentTemplateId,
      lineUser.id
    );


    // Reset the currently opened template.
    currentTemplateId =
      null;


    flexModel =
      createDefaultBubble();


    selectedPath =
      ["body"];


    jsonDirty =
      false;


    document.getElementById(
      "templateName"
    ).value =
      "";


    document.getElementById(
      "altText"
    ).value =
      "Flex Message";


    renderAll();


    // Clear stale local data first, then fetch a completely fresh
    // template list from Google Sheet.
    templates = [];

    renderTemplateList();

    await loadTemplateList(true);


    await Swal.fire({
      icon: "success",
      title: "Deleted",
      text: `${templateName} was deleted and the Template Library was refreshed.`,
      timer: 1600,
      showConfirmButton: false
    });

  }

  catch (error) {

    await Swal.fire({
      icon: "error",
      title: "Delete failed",
      text:
        error.message ||
        String(error),
      confirmButtonColor: "#087B40"
    });

  }

}



/* ============================================================
   SHARE LINE
============================================================ */

async function shareFlex() {

  try {

    if (
      !commitJsonIfNeeded()
    ) {

      return;

    }


    validateFlex(
      flexModel
    );


    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;

    }


    if (
      !liff.isApiAvailable(
        "shareTargetPicker"
      )
    ) {

      throw new Error(
        "shareTargetPicker is unavailable. Check LIFF settings."
      );

    }


    const altText =
      document
        .getElementById(
          "altText"
        )
        .value
        .trim()
      ||
      "Flex Message";


    const flexToSend =
      sanitizeFlexForLine(
        deepClone(
          flexModel
        )
      );


    const result =
      await liff.shareTargetPicker([
        {
          type:
            "flex",

          altText:
            altText,

          contents:
            flexToSend
        }
      ]);


    if (
      result
    ) {

      showStatus(
        "Flex Message shared.",
        "success"
      );

    }

  }

  catch (error) {

    showStatus(
      "Share failed: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   SANITIZE URL
============================================================ */

function sanitizeFlexForLine(obj) {

  walkObject(
    obj,
    value => {

      if (
        value &&
        typeof value === "object" &&
        value.type === "uri" &&
        typeof value.uri === "string"
      ) {

        value.uri =
          normalizeMarkdownUrl(
            value.uri
          );

      }

    }
  );


  return obj;

}


function normalizeMarkdownUrl(value) {

  const text =
    String(
      value ||
      ""
    ).trim();


  const match =
    text.match(
      /^\[([^\]]+)\]\((https?:\/\/.+)\)$/
    );


  if (
    match
  ) {

    return match[2];

  }


  return text;

}


function walkObject(
  value,
  callback
) {

  if (
    !value ||
    typeof value !== "object"
  ) {

    return;

  }


  callback(
    value
  );


  if (
    Array.isArray(
      value
    )
  ) {

    value.forEach(
      item =>
        walkObject(
          item,
          callback
        )
    );

  }

  else {

    Object.values(
      value
    ).forEach(
      item =>
        walkObject(
          item,
          callback
        )
    );

  }

}


/* ============================================================
   PATH
============================================================ */

function getByPath(path) {

  let value =
    flexModel;


  for (
    const key of path
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return undefined;

    }


    value =
      value[key];

  }


  return value;

}


function getParentInfo(path) {

  if (
    !path.length
  ) {

    return null;

  }


  const parentPath =
    path.slice(
      0,
      -1
    );


  return {
    parentPath,

    parent:
      getByPath(
        parentPath
      ),

    key:
      path[
        path.length - 1
      ]
  };

}


function pathEquals(
  a,
  b
) {

  return (
    JSON.stringify(a) ===
    JSON.stringify(b)
  );

}


function deepClone(value) {

  return JSON.parse(
    JSON.stringify(
      value
    )
  );

}


/* ============================================================
   TREE
============================================================ */

function renderTree() {

  const root =
    document.getElementById(
      "structureTree"
    );


  root.innerHTML =
    "";


  appendTreeNode(
    root,
    flexModel,
    [],
    0,
    "Flex"
  );

}


function appendTreeNode(
  parent,
  node,
  path,
  depth,
  label
) {

  if (
    !node ||
    typeof node !== "object"
  ) {

    return;

  }


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "tree-row";


  if (
    pathEquals(
      path,
      selectedPath
    )
  ) {

    row.classList.add(
      "selected"
    );

  }


  row.style.paddingLeft =
    (
      7 +
      depth * 12
    ) +
    "px";


  row.textContent =
    label +
    (
      node.type
        ? ` · ${node.type}`
        : ""
    );


  row.onclick =
    event => {

      event.stopPropagation();


      selectedPath =
        [...path];


      renderTree();

      renderPreview();

      renderProperties();

    };


  parent.appendChild(
    row
  );


  if (
    node.type === "bubble"
  ) {

    [
      "header",
      "hero",
      "body",
      "footer"
    ].forEach(
      section => {

        if (
          node[section]
        ) {

          appendTreeNode(
            parent,
            node[section],
            [
              ...path,
              section
            ],
            depth + 1,
            section
          );

        }

      }
    );

  }


  if (
    node.type === "carousel" &&
    Array.isArray(
      node.contents
    )
  ) {

    node.contents.forEach(
      (
        bubble,
        index
      ) => {

        appendTreeNode(
          parent,
          bubble,
          [
            ...path,
            "contents",
            index
          ],
          depth + 1,
          `Bubble ${index + 1}`
        );

      }
    );

  }


  if (
    node.type === "box" &&
    Array.isArray(
      node.contents
    )
  ) {

    node.contents.forEach(
      (
        child,
        index
      ) => {

        appendTreeNode(
          parent,
          child,
          [
            ...path,
            "contents",
            index
          ],
          depth + 1,
          getNodeLabel(
            child,
            index
          )
        );

      }
    );

  }

}


function getNodeLabel(
  node,
  index
) {

  if (
    node.type === "text"
  ) {

    return (
      `${index + 1}. Text: ` +
      String(
        node.text ||
        ""
      ).substring(
        0,
        18
      )
    );

  }


  if (
    node.type === "button"
  ) {

    return (
      `${index + 1}. Button: ` +
      (
        node.action?.label ||
        ""
      )
    );

  }


  return (
    `${index + 1}. ` +
    (
      node.type ||
      "object"
    )
  );

}


/* ============================================================
   PREVIEW
============================================================ */

function renderPreview() {

  const root =
    document.getElementById(
      "previewRoot"
    );


  root.innerHTML =
    "";


  if (
    flexModel.type ===
    "carousel"
  ) {

    const carousel =
      document.createElement(
        "div"
      );


    carousel.style.display =
      "flex";


    carousel.style.gap =
      "16px";


    carousel.style.alignItems =
      "flex-start";


    (
      flexModel.contents ||
      []
    ).forEach(
      (
        bubble,
        index
      ) => {

        carousel.appendChild(
          renderPreviewBubble(
            bubble,
            [
              "contents",
              index
            ]
          )
        );

      }
    );


    root.appendChild(
      carousel
    );

  }

  else {

    root.appendChild(
      renderPreviewBubble(
        flexModel,
        []
      )
    );

  }

}


/* ============================================================
   BUBBLE PREVIEW
============================================================ */

function renderPreviewBubble(
  bubble,
  path
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "flex-preview preview-element";


  makePreviewSelectable(
    card,
    path
  );


  if (
    bubble.hero
  ) {

    card.appendChild(
      renderPreviewNode(
        bubble.hero,
        [
          ...path,
          "hero"
        ],
        null
      )
    );

  }


  [
    "header",
    "body",
    "footer"
  ].forEach(
    sectionName => {

      if (
        !bubble[
          sectionName
        ]
      ) {

        return;

      }


      const section =
        renderPreviewNode(
          bubble[
            sectionName
          ],
          [
            ...path,
            sectionName
          ],
          null
        );


      const sectionStyle =
        bubble.styles?.[
          sectionName
        ];


      if (
        sectionStyle?.backgroundColor
      ) {

        section.style.backgroundColor =
          sectionStyle.backgroundColor;

      }


      if (
        sectionStyle?.separator
      ) {

        section.style.borderTop =
          `1px solid ${
            sectionStyle.separatorColor ||
            "#E5E7EB"
          }`;

      }


      card.appendChild(
        section
      );

    }
  );


  return card;

}


/* ============================================================
   PREVIEW NODE
============================================================ */

function renderPreviewNode(
  node,
  path,
  parentLayout
) {

  if (!node) {

    return document.createElement(
      "div"
    );

  }


  let el;


  /* ==============================
     TEXT
  ============================== */

  if (
    node.type === "text"
  ) {

    el =
      document.createElement(
        "div"
      );


    el.textContent =
      node.text ||
      "";


    el.style.whiteSpace =
      node.wrap === false
        ? "nowrap"
        : "pre-wrap";


    el.style.fontWeight =
      node.weight === "bold"
        ? "700"
        : "400";


    el.style.fontSize =
      flexSizeToCss(
        node.size
      );


    el.style.color =
      node.color ||
      "#222222";


    el.style.textAlign =
      node.align ||
      "start";


    el.style.lineHeight =
      "1.35";


    if (
      node.decoration ===
      "underline"
    ) {

      el.style.textDecoration =
        "underline";

    }


    if (
      node.decoration ===
      "line-through"
    ) {

      el.style.textDecoration =
        "line-through";

    }

  }


  /* ==============================
     IMAGE
  ============================== */

  else if (
    node.type === "image"
  ) {

    el =
      document.createElement(
        "img"
      );


    el.src =
      node.url ||
      "";


    el.alt =
      "Flex Image";


    el.style.display =
      "block";


    el.style.maxWidth =
      "100%";


    el.style.objectFit =
      node.aspectMode === "fit"
        ? "contain"
        : "cover";


    if (
      node.size === "full" &&
      !node.width
    ) {

      el.style.width =
        "100%";

    }


    if (
      node.aspectRatio
    ) {

      const ratio =
        node.aspectRatio
          .split(":")
          .map(Number);


      if (
        ratio.length === 2 &&
        ratio[0] &&
        ratio[1]
      ) {

        el.style.aspectRatio =
          `${ratio[0]} / ${ratio[1]}`;

      }

    }


    el.onerror =
      () => {

        el.style.minHeight =
          "100px";


        el.style.background =
          "#eeeeee";

      };

  }


  /* ==============================
     BUTTON
  ============================== */

  else if (
    node.type === "button"
  ) {

    el =
      document.createElement(
        "button"
      );


    el.textContent =
      node.action?.label ||
      "Button";


    el.style.width =
      "100%";


    el.style.borderRadius =
      "8px";


    el.style.fontSize =
      "15px";


    el.style.fontWeight =
      "700";


    if (
      node.height === "sm"
    ) {

      el.style.minHeight =
        "40px";

    }

    else if (
      node.height === "md"
    ) {

      el.style.minHeight =
        "48px";

    }

    else {

      el.style.minHeight =
        "44px";

    }


    if (
      node.style === "primary"
    ) {

      el.style.background =
        node.color ||
        "#06C755";


      el.style.color =
        "#ffffff";

    }

    else if (
      node.style === "secondary"
    ) {

      el.style.background =
        node.color ||
        "#eeeeee";


      el.style.color =
        "#222222";

    }

    else {

      el.style.background =
        "transparent";


      el.style.color =
        node.color ||
        "#0066cc";

    }

  }


  /* ==============================
     BOX
  ============================== */

  else if (
    node.type === "box"
  ) {

    el =
      document.createElement(
        "div"
      );


    el.className =
      "preview-box";


    const layout =
      node.layout ||
      "vertical";


    if (
      layout === "horizontal" ||
      layout === "baseline"
    ) {

      el.style.flexDirection =
        "row";

    }

    else {

      el.style.flexDirection =
        "column";

    }


    if (
      layout === "baseline"
    ) {

      el.style.alignItems =
        "baseline";

    }


    if (
      node.justifyContent
    ) {

      el.style.justifyContent =
        flexAlignmentToCss(
          node.justifyContent
        );

    }


    if (
      node.alignItems
    ) {

      el.style.alignItems =
        flexAlignmentToCss(
          node.alignItems
        );

    }


    if (
      node.spacing
    ) {

      el.style.gap =
        spacingToCss(
          node.spacing
        );

    }


    /*
     * LINE Box background:
     * - backgroundColor
     * - background: { type: "linearGradient", ... }
     */
    applyFlexBackground(
      el,
      node
    );


    if (
      node.cornerRadius
    ) {

      el.style.borderRadius =
        flexRadiusToCss(
          node.cornerRadius
        );

    }


    applyDimensions(
      el,
      node
    );


    applyPadding(
      el,
      node
    );


    if (
      node.borderWidth
    ) {

      el.style.borderStyle =
        "solid";


      el.style.borderWidth =
        flexDimensionToCss(
          node.borderWidth
        );


      el.style.borderColor =
        node.borderColor ||
        "#000000";

    }


    if (
      node.position ===
      "absolute"
    ) {

      el.style.position =
        "absolute";

    }

    else {

      el.style.position =
        "relative";

    }


    if (
      node.offsetTop
    ) {

      el.style.top =
        flexDimensionToCss(
          node.offsetTop
        );

    }


    if (
      node.offsetBottom
    ) {

      el.style.bottom =
        flexDimensionToCss(
          node.offsetBottom
        );

    }


    if (
      node.offsetStart
    ) {

      el.style.left =
        flexDimensionToCss(
          node.offsetStart
        );

    }


    if (
      node.offsetEnd
    ) {

      el.style.right =
        flexDimensionToCss(
          node.offsetEnd
        );

    }


    /*
     * Important for progress bars:
     * prevents colored child box escaping radius.
     */
    el.style.overflow =
      "hidden";


    (
      node.contents ||
      []
    ).forEach(
      (
        child,
        index
      ) => {

        const childEl =
          renderPreviewNode(
            child,
            [
              ...path,
              "contents",
              index
            ],
            layout
          );


        /*
         * LINE horizontal/baseline Flex behavior.
         *
         * flex: 0 = natural width
         * missing flex = flexible remaining space
         */
        if (
          layout === "horizontal" ||
          layout === "baseline"
        ) {

          if (
            child.flex === 0
          ) {

            childEl.style.flex =
              "0 0 auto";

          }

          else if (
            child.flex !== undefined &&
            child.flex !== null
          ) {

            childEl.style.flex =
              `${child.flex} ${child.flex} 0%`;

          }

          else {

            childEl.style.flex =
              "1 1 0%";

          }

        }


        el.appendChild(
          childEl
        );

      }
    );

  }


  /* ==============================
     SEPARATOR
  ============================== */

  else if (
    node.type ===
    "separator"
  ) {

    if (
      parentLayout === "horizontal"
    ) {

      el =
        document.createElement(
          "div"
        );


      el.style.width =
        "1px";


      el.style.alignSelf =
        "stretch";


      el.style.background =
        node.color ||
        "#dddddd";

    }

    else {

      el =
        document.createElement(
          "hr"
        );


      el.style.border =
        "0";


      el.style.borderTop =
        `1px solid ${
          node.color ||
          "#dddddd"
        }`;


      el.style.width =
        "100%";

    }

  }


  /* ==============================
     SPACER
  ============================== */

  else if (
    node.type === "spacer"
  ) {

    el =
      document.createElement(
        "div"
      );


    if (
      parentLayout === "horizontal"
    ) {

      el.style.width =
        spacingToCss(
          node.size ||
          "md"
        );

    }

    else {

      el.style.height =
        spacingToCss(
          node.size ||
          "md"
        );

    }

  }


  /* ==============================
     UNKNOWN
  ============================== */

  else {

    el =
      document.createElement(
        "div"
      );


    el.textContent =
      `[${node.type || "unknown"}]`;


    el.style.padding =
      "8px";


    el.style.background =
      "#fff3cd";

  }


  applyDimensions(
    el,
    node
  );


  applyMargin(
    el,
    node,
    parentLayout
  );


  if (
    node.flex === 0
  ) {

    el.style.flex =
      "0 0 auto";

  }


  el.classList.add(
    "preview-element"
  );


  makePreviewSelectable(
    el,
    path
  );


  return el;

}


/* ============================================================
   DIMENSION
   Critical fix for chart / progress bar
============================================================ */

function applyDimensions(
  el,
  node
) {

  if (
    node.width
  ) {

    el.style.width =
      flexDimensionToCss(
        node.width
      );

  }


  if (
    node.height
  ) {

    el.style.height =
      flexDimensionToCss(
        node.height
      );

  }


  if (
    node.maxWidth
  ) {

    el.style.maxWidth =
      flexDimensionToCss(
        node.maxWidth
      );

  }


  if (
    node.maxHeight
  ) {

    el.style.maxHeight =
      flexDimensionToCss(
        node.maxHeight
      );

  }


  if (
    node.minWidth
  ) {

    el.style.minWidth =
      flexDimensionToCss(
        node.minWidth
      );

  }


  if (
    node.minHeight
  ) {

    el.style.minHeight =
      flexDimensionToCss(
        node.minHeight
      );

  }

}


/* ============================================================
   PADDING
============================================================ */

function applyPadding(
  el,
  node
) {

  if (
    node.paddingAll
  ) {

    el.style.padding =
      spacingToCss(
        node.paddingAll
      );

  }


  if (
    node.paddingTop
  ) {

    el.style.paddingTop =
      spacingToCss(
        node.paddingTop
      );

  }


  if (
    node.paddingBottom
  ) {

    el.style.paddingBottom =
      spacingToCss(
        node.paddingBottom
      );

  }


  if (
    node.paddingStart
  ) {

    el.style.paddingLeft =
      spacingToCss(
        node.paddingStart
      );

  }


  if (
    node.paddingEnd
  ) {

    el.style.paddingRight =
      spacingToCss(
        node.paddingEnd
      );

  }

}


/* ============================================================
   MARGIN
============================================================ */

function applyMargin(
  el,
  node,
  parentLayout
) {

  if (
    !node.margin
  ) {

    return;

  }


  const margin =
    spacingToCss(
      node.margin
    );


  if (
    parentLayout === "horizontal" ||
    parentLayout === "baseline"
  ) {

    el.style.marginLeft =
      margin;

  }

  else {

    el.style.marginTop =
      margin;

  }

}


/* ============================================================
   SELECT PREVIEW ELEMENT
============================================================ */

function makePreviewSelectable(
  el,
  path
) {

  if (
    pathEquals(
      selectedPath,
      path
    )
  ) {

    el.classList.add(
      "selected-element"
    );

  }


  el.onclick =
    event => {

      event.preventDefault();

      event.stopPropagation();


      selectedPath =
        [...path];


      renderTree();

      renderPreview();

      renderProperties();

    };

}

/* ============================================================
   PROPERTY UI
============================================================ */

function createField(
  labelText
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "field";


  const label =
    document.createElement(
      "label"
    );


  label.textContent =
    labelText;


  wrapper.appendChild(
    label
  );


  return wrapper;

}


function addTextField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const input =
    document.createElement(
      "input"
    );


  input.value =
    value ??
    "";


  input.oninput =
    () =>
      onChange(
        input.value
      );


  wrapper.appendChild(
    input
  );


  root.appendChild(
    wrapper
  );

}


function addNumberField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "number";


  input.step =
    "1";


  input.value =
    value ??
    "";


  input.oninput =
    () =>
      onChange(
        input.value
      );


  wrapper.appendChild(
    input
  );


  root.appendChild(
    wrapper
  );

}


function addTextareaField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const input =
    document.createElement(
      "textarea"
    );


  input.rows =
    4;


  input.value =
    value ??
    "";


  input.oninput =
    () =>
      onChange(
        input.value
      );


  wrapper.appendChild(
    input
  );


  root.appendChild(
    wrapper
  );

}


function addSelectField(
  root,
  labelText,
  value,
  options,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const select =
    document.createElement(
      "select"
    );


  options.forEach(
    optionValue => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        optionValue;


      option.textContent =
        optionValue ||
        "Default";


      if (
        String(value) ===
        String(optionValue)
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );


  select.onchange =
    () =>
      onChange(
        select.value
      );


  wrapper.appendChild(
    select
  );


  root.appendChild(
    wrapper
  );

}


function addColorField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const group =
    document.createElement(
      "div"
    );


  group.style.display =
    "grid";


  group.style.gridTemplateColumns =
    "50px 1fr";


  group.style.gap =
    "7px";


  const color =
    document.createElement(
      "input"
    );


  color.type =
    "color";


  color.value =
    normalizeColor(
      value
    );


  const text =
    document.createElement(
      "input"
    );


  text.value =
    value;


  color.oninput =
    () => {

      text.value =
        color.value;


      onChange(
        color.value
      );

    };


  text.oninput =
    () => {

      if (
        /^#[0-9A-Fa-f]{6}$/
          .test(
            text.value
          )
      ) {

        color.value =
          text.value;

      }


      onChange(
        text.value
      );

    };


  group.appendChild(
    color
  );


  group.appendChild(
    text
  );


  wrapper.appendChild(
    group
  );


  root.appendChild(
    wrapper
  );

}


function addCheckboxField(
  root,
  labelText,
  checked,
  onChange
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "field";


  const label =
    document.createElement(
      "label"
    );


  label.style.display =
    "flex";


  label.style.alignItems =
    "center";


  label.style.gap =
    "8px";


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "checkbox";


  input.checked =
    checked;


  input.style.width =
    "auto";


  input.onchange =
    () =>
      onChange(
        input.checked
      );


  label.appendChild(
    input
  );


  label.appendChild(
    document.createTextNode(
      labelText
    )
  );


  wrapper.appendChild(
    label
  );


  root.appendChild(
    wrapper
  );

}


/* ============================================================
   UPDATE MODEL
============================================================ */

function updateProperty(
  key,
  value
) {

  if (
    !commitJsonIfNeeded()
  ) {

    return;

  }


  const node =
    getByPath(
      selectedPath
    );


  if (!node) {

    return;

  }


  if (
    value === ""
  ) {

    delete node[key];

  }

  else {

    node[key] =
      value;

  }


  refreshModelViews(
    true
  );

}


function updatePropertyLive(
  key,
  value
) {

  if (
    jsonDirty &&
    !commitJsonIfNeeded()
  ) {

    return;

  }


  const node =
    getByPath(
      selectedPath
    );


  if (!node) {

    return;

  }


  if (
    value === ""
  ) {

    delete node[key];

  }

  else {

    node[key] =
      value;

  }


  refreshModelViews(
    false
  );

}


function updateNumberProperty(
  key,
  value
) {

  const node =
    getByPath(
      selectedPath
    );


  if (!node) {

    return;

  }


  if (
    value === ""
  ) {

    delete node[key];

  }

  else {

    node[key] =
      Number(
        value
      );

  }


  refreshModelViews(
    false
  );

}


/* ============================================================
   BOX BACKGROUND EDITOR
============================================================ */

function setBoxBackgroundMode(
  node,
  mode
) {

  if (
    !node ||
    node.type !== "box"
  ) {

    return;

  }


  if (
    mode === "none"
  ) {

    delete node.background;
    delete node.backgroundColor;

  }


  else if (
    mode === "solid"
  ) {

    delete node.background;


    if (
      !node.backgroundColor
    ) {

      node.backgroundColor =
        "#FFFFFF";

    }

  }


  else if (
    mode === "linearGradient"
  ) {

    delete node.backgroundColor;


    if (
      !node.background ||
      node.background.type !== "linearGradient"
    ) {

      node.background = {
        type: "linearGradient",
        angle: "180deg",
        startColor: "#03002E",
        endColor: "#A5466F"
      };

    }

  }


  refreshModelViews(
    true
  );

}


function updateGradientProperty(
  node,
  key,
  value
) {

  if (
    !node
  ) {

    return;

  }


  if (
    !node.background ||
    node.background.type !== "linearGradient"
  ) {

    node.background = {
      type: "linearGradient",
      angle: "180deg",
      startColor: "#03002E",
      endColor: "#A5466F"
    };

  }


  if (
    value === ""
  ) {

    delete node.background[
      key
    ];

  }

  else {

    node.background[
      key
    ] =
      value;

  }


  refreshModelViews(
    false
  );

}


/* ============================================================
   BUTTON ACTION
============================================================ */

function changeButtonActionType(
  node,
  type
) {

  const label =
    node.action?.label ||
    "Button";


  if (
    type === "uri"
  ) {

    node.action = {
      type: "uri",
      label,
      uri: "https://line.me"
    };

  }

  else if (
    type === "message"
  ) {

    node.action = {
      type: "message",
      label,
      text: "Hello"
    };

  }

  else {

    node.action = {
      type: "postback",
      label,
      data: "action=example",
      displayText: "Example"
    };

  }


  refreshModelViews(
    true
  );

}


/* ============================================================
   ADD COMPONENT
============================================================ */

function addComponent(
  type
) {

  if (
    !commitJsonIfNeeded()
  ) {

    return;

  }


  const targetPath =
    findNearestBoxPath(
      selectedPath
    );


  if (
    !targetPath
  ) {

    showStatus(
      "Select a Box or an element inside a Box first.",
      "error"
    );

    return;

  }


  const box =
    getByPath(
      targetPath
    );


  if (
    !Array.isArray(
      box.contents
    )
  ) {

    box.contents =
      [];

  }


  box.contents.push(
    createComponent(
      type
    )
  );


  selectedPath = [
    ...targetPath,
    "contents",
    box.contents.length - 1
  ];


  refreshModelViews(
    true
  );

}


function createComponent(
  type
) {

  switch (type) {

    case "text":

      return {
        type: "text",
        text: "New text",
        wrap: true,
        size: "md"
      };


    case "image":

      return {
        type: "image",
        url:
          "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",
        size: "full",
        aspectRatio: "20:13",
        aspectMode: "cover"
      };


    case "button":

      return {
        type: "button",
        style: "primary",
        color: "#06C755",

        action: {
          type: "uri",
          label: "Open",
          uri: "https://line.me"
        }
      };


    case "box":

      return {
        type: "box",
        layout: "vertical",
        spacing: "sm",

        contents: [
          {
            type: "text",
            text: "New Box",
            wrap: true
          }
        ]
      };


    case "separator":

      return {
        type: "separator",
        margin: "md"
      };


    case "spacer":

      return {
        type: "spacer",
        size: "md"
      };


    default:

      throw new Error(
        "Unknown component: " +
        type
      );

  }

}


/* ============================================================
   CAROUSEL
============================================================ */

function addBubble() {

  if (
    !commitJsonIfNeeded()
  ) {

    return;

  }


  if (
    flexModel.type === "bubble"
  ) {

    flexModel = {
      type: "carousel",

      contents: [
        deepClone(
          flexModel
        ),

        createDefaultBubble()
      ]
    };


    selectedPath = [
      "contents",
      1
    ];

  }

  else {

    if (
      (
        flexModel.contents ||
        []
      ).length >= 12
    ) {

      showStatus(
        "LINE Flex Carousel supports up to 12 bubbles.",
        "error"
      );

      return;

    }


    flexModel.contents.push(
      createDefaultBubble()
    );


    selectedPath = [
      "contents",
      flexModel.contents.length - 1
    ];

  }


  refreshModelViews(
    true
  );

}


/* ============================================================
   FIND CONTAINER
============================================================ */

function findNearestBoxPath(path) {

  let current =
    [...path];


  while (true) {

    const node =
      getByPath(
        current
      );


    if (
      node?.type ===
      "box"
    ) {

      return current;

    }


    if (
      !current.length
    ) {

      break;

    }


    current.pop();

  }


  const bubblePath =
    findNearestBubblePath(
      path
    );


  if (
    bubblePath
  ) {

    const bubble =
      getByPath(
        bubblePath
      );


    if (
      !bubble.body
    ) {

      bubble.body = {
        type: "box",
        layout: "vertical",
        contents: []
      };

    }


    return [
      ...bubblePath,
      "body"
    ];

  }


  return null;

}


function findNearestBubblePath(path) {

  let current =
    [...path];


  while (true) {

    const node =
      getByPath(
        current
      );


    if (
      node?.type ===
      "bubble"
    ) {

      return current;

    }


    if (
      !current.length
    ) {

      break;

    }


    current.pop();

  }


  return null;

}


/* ============================================================
   DELETE / COPY / MOVE
============================================================ */

function removeSelected() {

  if (
    !commitJsonIfNeeded()
  ) {

    return;

  }


  if (
    !selectedPath.length
  ) {

    showStatus(
      "Cannot remove root Flex.",
      "error"
    );

    return;

  }


  const info =
    getParentInfo(
      selectedPath
    );


  if (!info) {

    return;

  }


  if (
    Array.isArray(
      info.parent
    )
  ) {

    info.parent.splice(
      Number(
        info.key
      ),
      1
    );


    selectedPath =
      info.parentPath.at(-1) ===
      "contents"
        ? info.parentPath.slice(
            0,
            -1
          )
        : [];

  }

  else {

    delete info.parent[
      info.key
    ];


    selectedPath =
      info.parentPath;

  }


  refreshModelViews(
    true
  );

}


function duplicateSelected() {

  if (
    !commitJsonIfNeeded()
  ) {

    return;

  }


  const info =
    getParentInfo(
      selectedPath
    );


  if (
    !info ||
    !Array.isArray(
      info.parent
    )
  ) {

    showStatus(
      "This element cannot be duplicated here.",
      "error"
    );

    return;

  }


  const index =
    Number(
      info.key
    );


  info.parent.splice(
    index + 1,
    0,
    deepClone(
      info.parent[index]
    )
  );


  selectedPath[
    selectedPath.length - 1
  ] =
    index + 1;


  refreshModelViews(
    true
  );

}


function moveSelected(
  direction
) {

  if (
    !commitJsonIfNeeded()
  ) {

    return;

  }


  const info =
    getParentInfo(
      selectedPath
    );


  if (
    !info ||
    !Array.isArray(
      info.parent
    )
  ) {

    return;

  }


  const index =
    Number(
      info.key
    );


  const next =
    index +
    direction;


  if (
    next < 0 ||
    next >=
    info.parent.length
  ) {

    return;

  }


  [
    info.parent[index],
    info.parent[next]
  ] = [
    info.parent[next],
    info.parent[index]
  ];


  selectedPath[
    selectedPath.length - 1
  ] =
    next;


  refreshModelViews(
    true
  );

}


/* ============================================================
   SELECTED JSON
============================================================ */

function syncSelectedJson() {

  const node =
    getByPath(
      selectedPath
    );


  document.getElementById(
    "elementJsonEditor"
  ).value =
    node
      ? JSON.stringify(
          node,
          null,
          2
        )
      : "";

}


function applyElementJson() {

  try {

    const value =
      JSON.parse(
        document
          .getElementById(
            "elementJsonEditor"
          )
          .value
      );


    if (
      !selectedPath.length
    ) {

      validateFlex(
        value
      );


      flexModel =
        value;


      selectedPath =
        getDefaultSelectionPath();

    }

    else {

      const info =
        getParentInfo(
          selectedPath
        );


      if (!info) {

        throw new Error(
          "Parent element not found."
        );

      }


      info.parent[
        info.key
      ] =
        value;

    }


    refreshModelViews(
      true
    );


    showStatus(
      "Element JSON applied.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "Element JSON error: " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   FULL JSON
============================================================ */

function syncFullJson() {

  document.getElementById(
    "jsonEditor"
  ).value =
    JSON.stringify(
      flexModel,
      null,
      2
    );


  jsonDirty =
    false;

}


function applyFullJson() {

  try {

    const parsed =
      JSON.parse(
        document
          .getElementById(
            "jsonEditor"
          )
          .value
      );


    validateFlex(
      parsed
    );


    flexModel =
      parsed;


    selectedPath =
      getDefaultSelectionPath();


    jsonDirty =
      false;


    renderAll();


    showStatus(
      "JSON applied to Visual Designer.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "JSON error: " +
      error.message,
      "error"
    );

  }

}


function formatFullJson() {

  try {

    const editor =
      document.getElementById(
        "jsonEditor"
      );


    editor.value =
      JSON.stringify(
        JSON.parse(
          editor.value
        ),
        null,
        2
      );


    showStatus(
      "JSON formatted.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "JSON error: " +
      error.message,
      "error"
    );

  }

}


async function copyFullJson() {

  try {

    await navigator.clipboard.writeText(
      document
        .getElementById(
          "jsonEditor"
        )
        .value
    );


    showStatus(
      "JSON copied.",
      "success"
    );

  }

  catch {

    showStatus(
      "Unable to copy JSON.",
      "error"
    );

  }

}


function commitJsonIfNeeded() {

  if (
    !jsonDirty
  ) {

    return true;

  }


  try {

    const parsed =
      JSON.parse(
        document
          .getElementById(
            "jsonEditor"
          )
          .value
      );


    validateFlex(
      parsed
    );


    flexModel =
      parsed;


    selectedPath =
      getDefaultSelectionPath();


    jsonDirty =
      false;


    renderTree();

    renderPreview();

    renderProperties();


    return true;

  }

  catch (error) {

    showStatus(
      "Fix Full JSON first: " +
      error.message,
      "error"
    );


    return false;

  }

}


/* ============================================================
   VALIDATION
============================================================ */

function validateFlex(
  json
) {

  if (
    !json ||
    typeof json !==
    "object"
  ) {

    throw new Error(
      "Invalid Flex JSON."
    );

  }


  if (
    json.type !== "bubble" &&
    json.type !== "carousel"
  ) {

    throw new Error(
      'Root type must be "bubble" or "carousel".'
    );

  }


  if (
    json.type === "carousel"
  ) {

    if (
      !Array.isArray(
        json.contents
      )
    ) {

      throw new Error(
        "Carousel must contain contents array."
      );

    }


    if (
      json.contents.length >
      12
    ) {

      throw new Error(
        "Carousel cannot contain more than 12 bubbles."
      );

    }

  }


  return true;

}


/* ============================================================
   RENDER
============================================================ */

function refreshModelViews(
  rebuildProperties = true
) {

  jsonDirty =
    false;


  renderTree();

  renderPreview();


  if (
    rebuildProperties
  ) {

    renderProperties();

  }

  else {

    syncSelectedJson();

  }


  syncFullJson();

}


function renderAll() {

  renderTree();

  renderPreview();

  renderProperties();

  syncFullJson();

}


function getDefaultSelectionPath() {

  if (
    flexModel.type ===
    "bubble"
  ) {

    return flexModel.body
      ? ["body"]
      : [];

  }


  if (
    flexModel.type ===
    "carousel" &&
    flexModel.contents?.length
  ) {

    return flexModel.contents[0].body
      ? [
          "contents",
          0,
          "body"
        ]
      : [
          "contents",
          0
        ];

  }


  return [];

}


/* ============================================================
   LINE BOX BACKGROUND → CSS
============================================================ */

/*
 * LINE Flex Box supports:
 *
 * 1) Solid color
 *    "backgroundColor": "#03002E"
 *
 * 2) Linear gradient
 *    "background": {
 *      "type": "linearGradient",
 *      "angle": "180deg",
 *      "startColor": "#03002E",
 *      "endColor": "#A5466F"
 *    }
 *
 * Optional three-color gradient:
 *    "centerColor": "#6D285B",
 *    "centerPosition": "50%"
 */
function applyFlexBackground(
  el,
  node
) {

  if (
    !el ||
    !node
  ) {

    return;

  }


  const background =
    node.background;


  if (
    background &&
    background.type === "linearGradient"
  ) {

    const angle =
      normalizeGradientAngle(
        background.angle ||
        "0deg"
      );


    const startColor =
      background.startColor ||
      "#FFFFFF";


    const endColor =
      background.endColor ||
      startColor;


    if (
      background.centerColor
    ) {

      const centerPosition =
        normalizeGradientPosition(
          background.centerPosition ||
          "50%"
        );


      el.style.backgroundImage =
        `linear-gradient(` +
        `${angle}, ` +
        `${startColor} 0%, ` +
        `${background.centerColor} ${centerPosition}, ` +
        `${endColor} 100%` +
        `)`;

    }

    else {

      el.style.backgroundImage =
        `linear-gradient(` +
        `${angle}, ` +
        `${startColor} 0%, ` +
        `${endColor} 100%` +
        `)`;

    }


    /*
     * Clear a previously assigned solid CSS background color
     * when switching the same preview node to gradient mode.
     */
    el.style.backgroundColor =
      "transparent";


    return;

  }


  /*
   * Solid background fallback.
   */
  if (
    node.backgroundColor
  ) {

    el.style.backgroundImage =
      "none";


    el.style.backgroundColor =
      node.backgroundColor;

  }

}


function normalizeGradientAngle(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "0deg";

  }


  if (
    typeof value === "number"
  ) {

    return `${value}deg`;

  }


  const text =
    String(
      value
    ).trim();


  if (
    /^-?\d+(\.\d+)?deg$/i
      .test(
        text
      )
  ) {

    return text;

  }


  if (
    /^-?\d+(\.\d+)?$/
      .test(
        text
      )
  ) {

    return `${text}deg`;

  }


  return text;

}


function normalizeGradientPosition(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "50%";

  }


  if (
    typeof value === "number"
  ) {

    return `${value}%`;

  }


  const text =
    String(
      value
    ).trim();


  if (
    /^-?\d+(\.\d+)?%$/
      .test(
        text
      )
  ) {

    return text;

  }


  if (
    /^-?\d+(\.\d+)?$/
      .test(
        text
      )
  ) {

    return `${text}%`;

  }


  return text;

}


/* ============================================================
   FLEX → CSS
============================================================ */

function flexSizeToCss(size) {

  const map = {
    xxs: "10px",
    xs: "12px",
    sm: "14px",
    md: "16px",
    lg: "18px",
    xl: "20px",
    xxl: "24px",
    "3xl": "30px",
    "4xl": "40px",
    "5xl": "48px"
  };


  return (
    map[size] ||
    "16px"
  );

}


/*
 * Supports:
 *
 * 12px
 * 64.2%
 * 20px
 * 2em
 * 100%
 * raw numbers
 */
function flexDimensionToCss(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "";

  }


  if (
    typeof value ===
    "number"
  ) {

    return `${value}px`;

  }


  const text =
    String(
      value
    ).trim();


  if (
    /^-?\d+(\.\d+)?(px|%|em|rem|vw|vh)$/
      .test(
        text
      )
  ) {

    return text;

  }


  if (
    /^-?\d+(\.\d+)?$/
      .test(
        text
      )
  ) {

    return `${text}px`;

  }


  return text;

}


/*
 * Supports both LINE keywords and
 * direct px values like "24px".
 */
function spacingToCss(
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return "0px";

  }


  const map = {
    none: "0px",
    xs: "4px",
    sm: "8px",
    md: "12px",
    lg: "16px",
    xl: "24px",
    xxl: "32px"
  };


  if (
    Object.prototype
      .hasOwnProperty
      .call(
        map,
        value
      )
  ) {

    return map[value];

  }


  return (
    flexDimensionToCss(
      value
    ) ||
    "0px"
  );

}


function flexRadiusToCss(
  value
) {

  const map = {
    none: "0px",
    xs: "4px",
    sm: "7px",
    md: "10px",
    lg: "14px",
    xl: "20px",
    xxl: "30px"
  };


  if (
    Object.prototype
      .hasOwnProperty
      .call(
        map,
        value
      )
  ) {

    return map[value];

  }


  return (
    flexDimensionToCss(
      value
    ) ||
    "0px"
  );

}


function flexAlignmentToCss(
  value
) {

  const map = {
    start: "flex-start",
    center: "center",
    end: "flex-end",

    "space-between":
      "space-between",

    "space-around":
      "space-around",

    "space-evenly":
      "space-evenly"
  };


  return (
    map[value] ||
    value
  );

}


function normalizeColor(
  color
) {

  const text =
    String(
      color ||
      ""
    ).trim();


  /*
   * input[type="color"] accepts #RRGGBB.
   * LINE also allows #RRGGBBAA in several color fields,
   * so keep the alpha-aware value in the text input while
   * using the first six RGB digits for the color picker.
   */
  if (
    /^#[0-9A-Fa-f]{8}$/
      .test(
        text
      )
  ) {

    return text.slice(
      0,
      7
    );

  }


  if (
    /^#[0-9A-Fa-f]{6}$/
      .test(
        text
      )
  ) {

    return text;

  }


  return "#ffffff";

}


/* ============================================================
   SAFE HTML FOR SWEETALERT
============================================================ */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ============================================================
   STATUS
============================================================ */

let statusTimer;


function showStatus(
  message,
  type = ""
) {

  // Prefer SweetAlert2 toast for normal notifications.
  if (
    typeof Swal !== "undefined"
  ) {

    const iconMap = {
      success: "success",
      error: "error",
      warning: "warning",
      info: "info"
    };


    Swal.fire({
      toast: true,
      position: "top-end",
      icon:
        iconMap[type] ||
        "info",
      title:
        message,
      showConfirmButton: false,
      timer:
        type === "error"
          ? 3500
          : 1800,
      timerProgressBar: true
    });


    return;

  }


  // Fallback in case the SweetAlert CDN is unavailable.
  clearTimeout(
    statusTimer
  );


  const el =
    document.getElementById(
      "status"
    );


  el.textContent =
    message;


  el.className =
    "status " +
    type;


  el.style.display =
    "block";


  statusTimer =
    setTimeout(
      () => {

        el.style.display =
          "none";

      },
      3500
    );

}



/* ============================================================
   START
============================================================ */

init();

</script>
