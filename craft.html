<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<title>LINE Flex Studio</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

:root {
  --primary: #06c755;
  --primary-dark: #05a947;

  --bg: #f5f7f6;
  --card: #ffffff;
  --surface: #f9fbfa;

  --border: #dfe6e2;

  --text: #17211c;
  --muted: #718078;

  --danger: #d92d20;

  --blue: #2563eb;

  --radius: 12px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

/* =========================================
   HEADER
========================================= */

header {
  min-height: 68px;

  background: white;

  border-bottom: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 12px 20px;

  position: sticky;
  top: 0;
  z-index: 30;
}

.brand h1 {
  margin: 0;

  font-size: 20px;
}

.brand small {
  color: var(--muted);
}

.user-info {
  font-size: 13px;
  color: var(--muted);
}

/* =========================================
   MAIN
========================================= */

.app {
  display: grid;

  grid-template-columns:
    260px
    minmax(300px, 1fr)
    380px;

  gap: 14px;

  padding: 14px;

  min-height: calc(100vh - 68px);
}

.panel {
  background: white;

  border: 1px solid var(--border);

  border-radius: var(--radius);

  overflow: hidden;
}

.panel-header {
  min-height: 50px;

  padding: 12px 14px;

  border-bottom: 1px solid var(--border);

  display: flex;
  align-items: center;
  justify-content: space-between;

  font-weight: 700;
}

.panel-body {
  padding: 14px;
}

/* =========================================
   BUTTONS
========================================= */

button {
  border: 0;

  border-radius: 7px;

  padding: 9px 12px;

  cursor: pointer;

  font-weight: 600;

  font-size: 13px;
}

button:hover {
  opacity: .9;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-dark {
  background: #17211c;
  color: white;
}

.btn-light {
  background: #eef3f0;
  color: #24352c;
}

.btn-blue {
  background: var(--blue);
  color: white;
}

.btn-danger {
  background: #fff1f0;
  color: var(--danger);
}

.btn-small {
  padding: 6px 8px;

  font-size: 12px;
}

/* =========================================
   INPUT
========================================= */

label {
  display: block;

  font-size: 12px;
  font-weight: 650;

  margin-bottom: 5px;
}

input,
select,
textarea {
  width: 100%;

  border: 1px solid var(--border);

  border-radius: 7px;

  padding: 9px 10px;

  background: white;

  color: var(--text);

  font-size: 13px;

  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--primary);
}

.field {
  margin-bottom: 12px;
}

.field-row {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;
}

/* =========================================
   TEMPLATE LIBRARY
========================================= */

.template-search {
  margin-bottom: 10px;
}

.template-list {
  max-height: calc(100vh - 230px);

  overflow-y: auto;
}

.template-item {
  padding: 10px;

  border: 1px solid var(--border);

  border-radius: 8px;

  margin-bottom: 7px;

  cursor: pointer;
}

.template-item:hover,
.template-item.active {
  border-color: var(--primary);

  background: #f1fff6;
}

.template-name {
  font-weight: 650;

  font-size: 13px;
}

.template-date {
  margin-top: 4px;

  font-size: 10px;

  color: var(--muted);
}

/* =========================================
   CENTER EDITOR
========================================= */

.editor-toolbar {
  display: flex;

  gap: 6px;

  flex-wrap: wrap;
}

.metadata {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  padding: 14px;

  border-bottom: 1px solid var(--border);
}

/* =========================================
   COMPONENT TOOLBAR
========================================= */

.component-toolbar {
  padding: 10px 14px;

  display: flex;

  flex-wrap: wrap;

  gap: 6px;

  border-bottom: 1px solid var(--border);

  background: var(--surface);
}

/* =========================================
   DESIGN AREA
========================================= */

.design-area {
  display: grid;

  grid-template-columns: 230px 1fr;

  min-height: 650px;
}

/* =========================================
   TREE
========================================= */

.tree-area {
  border-right: 1px solid var(--border);

  padding: 12px;

  overflow: auto;

  max-height: calc(100vh - 270px);
}

.tree-title {
  font-weight: 700;

  font-size: 12px;

  margin-bottom: 10px;

  color: var(--muted);
}

.tree-row {
  font-size: 12px;

  padding: 6px 7px;

  cursor: pointer;

  border-radius: 6px;

  margin-bottom: 2px;

  white-space: nowrap;
}

.tree-row:hover {
  background: #f2f5f3;
}

.tree-row.selected {
  background: #e7f8ed;

  color: #057a36;

  font-weight: 700;
}

/* =========================================
   PREVIEW
========================================= */

.preview-area {
  background:
    radial-gradient(
      circle at 1px 1px,
      #dfe5e1 1px,
      transparent 1px
    );

  background-size: 18px 18px;

  padding: 30px;

  overflow: auto;

  display: flex;

  justify-content: center;

  align-items: flex-start;
}

.flex-preview {
  width: 350px;

  min-height: 150px;

  background: white;

  border-radius: 15px;

  overflow: hidden;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}

.preview-section {
  padding: 16px;
}

.preview-box {
  display: flex;

  min-width: 0;
}

.preview-element {
  cursor: pointer;

  position: relative;
}

.preview-element.selected-element {
  outline:
    2px solid var(--primary);

  outline-offset: 2px;
}

/* =========================================
   INSPECTOR
========================================= */

.inspector {
  max-height: calc(100vh - 68px);

  overflow-y: auto;
}

.inspector-section {
  padding: 14px;

  border-bottom: 1px solid var(--border);
}

.inspector-section h3 {
  font-size: 13px;

  margin:
    0
    0
    12px;
}

.element-type {
  display: inline-block;

  padding: 4px 8px;

  border-radius: 50px;

  background: #eaf8ef;

  color: #087b40;

  font-size: 11px;

  font-weight: 700;

  margin-bottom: 12px;
}

/* =========================================
   JSON EDITOR
========================================= */

#jsonEditor,
#elementJsonEditor {
  font-family:
    "SFMono-Regular",
    Consolas,
    monospace;

  line-height: 1.5;

  font-size: 12px;

  resize: vertical;
}

#jsonEditor {
  height: 350px;
}

#elementJsonEditor {
  height: 180px;
}

/* =========================================
   STATUS
========================================= */

.status {
  position: fixed;

  bottom: 15px;
  right: 15px;

  max-width: 420px;

  background: #17211c;

  color: white;

  border-radius: 8px;

  padding: 10px 14px;

  font-size: 12px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.2);

  z-index: 99;

  display: none;
}

.status.success {
  background: #087b40;
}

.status.error {
  background: #b42318;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width: 1150px) {

  .app {
    grid-template-columns:
      220px
      1fr;
  }

  .inspector {
    grid-column: 1 / -1;

    max-height: none;
  }

}

@media(max-width: 780px) {

  .app {
    grid-template-columns: 1fr;
  }

  .metadata {
    grid-template-columns: 1fr;
  }

  .design-area {
    grid-template-columns: 1fr;
  }

  .tree-area {
    border-right: 0;

    border-bottom: 1px solid var(--border);

    max-height: 220px;
  }

  .preview-area {
    padding: 20px 5px;
  }

  .flex-preview {
    width: min(350px, 95vw);
  }

}

</style>
</head>

<body>

<header>

  <div class="brand">

    <h1>LINE Flex Studio</h1>

    <small>
      Visual Designer • JSON • Template Library
    </small>

  </div>

  <div
    id="userInfo"
    class="user-info"
  >
    Connecting LINE...
  </div>

</header>


<div class="app">


<!-- ====================================================
     TEMPLATE LIBRARY
==================================================== -->

<section class="panel">

  <div class="panel-header">

    <span>Template Library</span>

    <button
      class="btn-light btn-small"
      onclick="newTemplate()"
    >
      + New
    </button>

  </div>


  <div class="panel-body">

    <input
      id="searchInput"
      class="template-search"
      placeholder="Search..."
      oninput="renderTemplateList()"
    >

    <div
      id="templateList"
      class="template-list"
    ></div>

  </div>

</section>


<!-- ====================================================
     MAIN DESIGNER
==================================================== -->

<section class="panel">


<div class="panel-header">

  <span>Flex Designer</span>


  <div class="editor-toolbar">

    <button
      class="btn-light"
      onclick="newTemplate()"
    >
      New
    </button>

    <button
      class="btn-primary"
      onclick="saveCurrentTemplate()"
    >
      Save
    </button>

    <button
      class="btn-light"
      onclick="duplicateTemplate()"
    >
      Duplicate
    </button>

    <button
      class="btn-danger"
      onclick="deleteCurrentTemplate()"
    >
      Delete
    </button>

    <button
      class="btn-dark"
      onclick="shareFlex()"
    >
      Share LINE
    </button>

  </div>

</div>


<!-- Metadata -->

<div class="metadata">

  <div>

    <label>Template Name</label>

    <input
      id="templateName"
      placeholder="My Flex Template"
    >

  </div>


  <div>

    <label>LINE altText</label>

    <input
      id="altText"
      value="Flex Message"
      maxlength="400"
    >

  </div>

</div>


<!-- Component Toolbar -->

<div class="component-toolbar">

  <button
    class="btn-light"
    onclick="addComponent('text')"
  >
    + Text
  </button>

  <button
    class="btn-light"
    onclick="addComponent('image')"
  >
    + Image
  </button>

  <button
    class="btn-light"
    onclick="addComponent('button')"
  >
    + Button
  </button>

  <button
    class="btn-light"
    onclick="addComponent('box')"
  >
    + Box
  </button>

  <button
    class="btn-light"
    onclick="addComponent('separator')"
  >
    + Separator
  </button>

  <button
    class="btn-light"
    onclick="addComponent('spacer')"
  >
    + Spacer
  </button>

  <button
    class="btn-blue"
    onclick="addBubble()"
  >
    + Bubble
  </button>

  <span style="flex:1"></span>

  <button
    class="btn-light"
    onclick="moveSelected(-1)"
  >
    ↑
  </button>

  <button
    class="btn-light"
    onclick="moveSelected(1)"
  >
    ↓
  </button>

  <button
    class="btn-light"
    onclick="duplicateSelected()"
  >
    Copy
  </button>

  <button
    class="btn-danger"
    onclick="removeSelected()"
  >
    Remove
  </button>

</div>


<div class="design-area">


<!-- TREE -->

<div class="tree-area">

  <div class="tree-title">
    STRUCTURE
  </div>

  <div id="structureTree"></div>

</div>


<!-- PREVIEW -->

<div class="preview-area">

  <div id="previewRoot"></div>

</div>


</div>

</section>


<!-- ====================================================
     PROPERTY INSPECTOR
==================================================== -->

<section class="panel inspector">

  <div class="panel-header">

    <span>Properties</span>

  </div>


  <div
    id="propertyEditor"
    class="inspector-section"
  >
  </div>


  <!-- Selected JSON -->

  <div class="inspector-section">

    <h3>Selected Element JSON</h3>

    <textarea
      id="elementJsonEditor"
    ></textarea>

    <button
      style="margin-top:8px"
      class="btn-light"
      onclick="applyElementJson()"
    >
      Apply Element JSON
    </button>

  </div>


  <!-- Entire Flex JSON -->

  <div class="inspector-section">

    <h3>Full Flex JSON</h3>

    <textarea
      id="jsonEditor"
      oninput="jsonDirty = true"
    ></textarea>


    <div
      style="
        display:flex;
        gap:6px;
        flex-wrap:wrap;
        margin-top:8px;
      "
    >

      <button
        class="btn-blue"
        onclick="applyFullJson()"
      >
        Apply JSON
      </button>

      <button
        class="btn-light"
        onclick="formatFullJson()"
      >
        Format
      </button>

      <button
        class="btn-light"
        onclick="copyFullJson()"
      >
        Copy JSON
      </button>

    </div>

  </div>

</section>


</div>


<div
  id="status"
  class="status"
></div>


<script>

/* ============================================================
   CONFIG
============================================================ */

const LIFF_ID =
  "2007125937-fXcIzxO8";


let currentTemplateId = null;

let templates = [];

let jsonDirty = false;


let lineUser = {

  id: "default-user",

  name: "LINE User"

};


/* ============================================================
   DEFAULT FLEX
============================================================ */

function createDefaultBubble() {

  return {

    type: "bubble",

    body: {

      type: "box",

      layout: "vertical",

      spacing: "md",

      contents: [

        {

          type: "text",

          text: "Hello, World!",

          weight: "bold",

          size: "xl",

          wrap: true

        },

        {

          type: "text",

          text: "Edit this Flex message visually.",

          color: "#666666",

          size: "sm",

          wrap: true

        },

        {

          type: "button",

          style: "primary",

          color: "#06C755",

          action: {

            type: "uri",

            label: "Open website",

            uri: "https://line.me"

          }

        }

      ]

    }

  };

}


let flexModel =
  createDefaultBubble();


let selectedPath = ["body"];


/* ============================================================
   INIT LIFF
============================================================ */

async function init() {

  try {

    await liff.init({

      liffId: LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    try {

      const profile =
        await liff.getProfile();


      lineUser = {

        id: profile.userId,

        name: profile.displayName

      };


      document.getElementById(
        "userInfo"
      ).textContent =
        profile.displayName;

    }

    catch (error) {

      const idToken =
        liff.getDecodedIDToken();


      if (idToken?.sub) {

        lineUser.id =
          idToken.sub;

      }


      document.getElementById(
        "userInfo"
      ).textContent =
        "LINE User";

    }


    await loadTemplateList();


    renderAll();

  }

  catch (error) {

    showStatus(

      "LIFF error: " +
      error.message,

      "error"

    );

  }

}


/* ============================================================
   GAS PROMISE WRAPPERS
============================================================ */

function server(method, ...args) {

  return new Promise(
    (resolve, reject) => {

      if (
        typeof google === "undefined" ||
        !google.script
      ) {

        reject(

          new Error(
            "google.script.run is unavailable. Open this page from Apps Script Web App."
          )

        );

        return;

      }


      google.script.run

        .withSuccessHandler(resolve)

        .withFailureHandler(error => {

          reject(

            new Error(
              error?.message ||
              String(error)
            )

          );

        })[method](...args);

    }
  );

}


/* ============================================================
   TEMPLATE LIST
============================================================ */

async function loadTemplateList() {

  try {

    templates =
      await server(

        "getTemplates",

        lineUser.id

      );


    renderTemplateList();

  }

  catch (error) {

    console.warn(error);

    renderTemplateList();

  }

}


function renderTemplateList() {

  const root =
    document.getElementById(
      "templateList"
    );


  root.innerHTML = "";


  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    templates.filter(
      template =>
        template.name
          .toLowerCase()
          .includes(query)
    );


  if (!filtered.length) {

    root.innerHTML =
      `
        <div
          style="
            font-size:12px;
            color:#718078;
            padding:8px;
          "
        >
          No templates
        </div>
      `;

    return;

  }


  filtered.forEach(template => {

    const item =
      document.createElement("div");


    item.className =
      "template-item";


    if (
      template.id ===
      currentTemplateId
    ) {

      item.classList.add(
        "active"
      );

    }


    const name =
      document.createElement("div");

    name.className =
      "template-name";

    name.textContent =
      template.name;


    const date =
      document.createElement("div");

    date.className =
      "template-date";

    date.textContent =
      template.updatedAt || "";


    item.appendChild(name);

    item.appendChild(date);


    item.onclick =
      () => openTemplate(
        template.id
      );


    root.appendChild(item);

  });

}


/* ============================================================
   OPEN TEMPLATE
============================================================ */

async function openTemplate(id) {

  try {

    const data =
      await server(

        "getTemplate",

        id,

        lineUser.id

      );


    const parsed =
      JSON.parse(
        data.flexJson
      );


    flexModel =
      parsed;


    currentTemplateId =
      data.id;


    document.getElementById(
      "templateName"
    ).value =
      data.templateName;


    document.getElementById(
      "altText"
    ).value =
      data.altText;


    selectedPath =
      getDefaultSelectionPath();


    jsonDirty =
      false;


    renderAll();


    renderTemplateList();


    showStatus(

      "Template loaded",

      "success"

    );

  }

  catch (error) {

    showStatus(
      error.message,
      "error"
    );

  }

}


/* ============================================================
   NEW
============================================================ */

function newTemplate() {

  currentTemplateId =
    null;


  flexModel =
    createDefaultBubble();


  selectedPath =
    ["body"];


  document.getElementById(
    "templateName"
  ).value = "";


  document.getElementById(
    "altText"
  ).value =
    "Flex Message";


  jsonDirty =
    false;


  renderAll();

  renderTemplateList();


  showStatus(
    "New template"
  );

}


/* ============================================================
   SAVE TEMPLATE
============================================================ */

async function saveCurrentTemplate() {

  try {

    if (!commitJsonIfNeeded()) {
      return;
    }


    validateFlex(
      flexModel
    );


    const name =
      document
        .getElementById(
          "templateName"
        )
        .value
        .trim();


    if (!name) {

      throw new Error(
        "Enter Template Name first."
      );

    }


    const altText =
      document
        .getElementById(
          "altText"
        )
        .value
        .trim() ||
      "Flex Message";


    const result =
      await server(

        "saveTemplate",

        {

          id:
            currentTemplateId,

          ownerId:
            lineUser.id,

          ownerName:
            lineUser.name,

          templateName:
            name,

          altText:
            altText,

          flexJson:
            JSON.stringify(
              flexModel,
              null,
              2
            )

        }

      );


    currentTemplateId =
      result.id;


    await loadTemplateList();


    showStatus(

      result.mode === "created"
        ? "Template created"
        : "Template updated",

      "success"

    );

  }

  catch (error) {

    showStatus(
      error.message,
      "error"
    );

  }

}


/* ============================================================
   DUPLICATE TEMPLATE
============================================================ */

function duplicateTemplate() {

  currentTemplateId =
    null;


  const input =
    document.getElementById(
      "templateName"
    );


  input.value =
    (
      input.value ||
      "Flex Template"
    ) + " Copy";


  renderTemplateList();


  showStatus(

    "Duplicated. Click Save to create a new template.",

    "success"

  );

}


/* ============================================================
   DELETE
============================================================ */

async function deleteCurrentTemplate() {

  if (!currentTemplateId) {

    showStatus(
      "This template has not been saved yet.",
      "error"
    );

    return;

  }


  if (
    !confirm(
      "Delete this template?"
    )
  ) {

    return;

  }


  try {

    await server(

      "deleteTemplate",

      currentTemplateId,

      lineUser.id

    );


    newTemplate();


    await loadTemplateList();


    showStatus(
      "Template deleted",
      "success"
    );

  }

  catch (error) {

    showStatus(
      error.message,
      "error"
    );

  }

}


/* ============================================================
   SHARE LINE
============================================================ */

async function shareFlex() {

  try {

    if (!commitJsonIfNeeded()) {
      return;
    }


    validateFlex(
      flexModel
    );


    if (
      !liff.isApiAvailable(
        "shareTargetPicker"
      )
    ) {

      throw new Error(
        "shareTargetPicker is unavailable."
      );

    }


    const altText =
      document
        .getElementById(
          "altText"
        )
        .value
        .trim() ||
      "Flex Message";


    const result =
      await liff.shareTargetPicker([

        {

          type: "flex",

          altText,

          contents:
            deepClone(
              flexModel
            )

        }

      ]);


    if (result) {

      showStatus(
        "Flex message shared.",
        "success"
      );

    }

  }

  catch (error) {

    showStatus(

      "Share failed: " +
      error.message,

      "error"

    );

  }

}


/* ============================================================
   PATH FUNCTIONS
============================================================ */

function getByPath(path) {

  let value =
    flexModel;


  for (const key of path) {

    if (
      value === undefined ||
      value === null
    ) {

      return undefined;

    }

    value =
      value[key];

  }


  return value;

}


function getParentInfo(path) {

  if (!path.length) {

    return null;

  }


  const parentPath =
    path.slice(
      0,
      -1
    );


  return {

    parentPath,

    parent:
      getByPath(
        parentPath
      ),

    key:
      path[
        path.length - 1
      ]

  };

}


function pathEquals(a, b) {

  return (
    JSON.stringify(a) ===
    JSON.stringify(b)
  );

}


function deepClone(value) {

  return JSON.parse(
    JSON.stringify(value)
  );

}


/* ============================================================
   TREE
============================================================ */

function renderTree() {

  const root =
    document.getElementById(
      "structureTree"
    );


  root.innerHTML = "";


  appendTreeNode(

    root,

    flexModel,

    [],

    0,

    "Flex"

  );

}


function appendTreeNode(
  parent,
  node,
  path,
  depth,
  label
) {

  if (
    !node ||
    typeof node !== "object"
  ) {

    return;

  }


  const row =
    document.createElement("div");


  row.className =
    "tree-row";


  if (
    pathEquals(
      path,
      selectedPath
    )
  ) {

    row.classList.add(
      "selected"
    );

  }


  row.style.paddingLeft =
    (
      7 +
      depth * 12
    ) + "px";


  row.textContent =
    label +
    (
      node.type
        ? ` · ${node.type}`
        : ""
    );


  row.onclick =
    event => {

      event.stopPropagation();

      selectedPath =
        [...path];

      renderAll(
        false
      );

    };


  parent.appendChild(
    row
  );


  /* Bubble Sections */

  if (
    node.type === "bubble"
  ) {

    [
      "header",
      "hero",
      "body",
      "footer"
    ].forEach(section => {

      if (node[section]) {

        appendTreeNode(

          parent,

          node[section],

          [
            ...path,
            section
          ],

          depth + 1,

          section

        );

      }

    });

  }


  /* Carousel bubbles */

  if (
    node.type === "carousel" &&
    Array.isArray(
      node.contents
    )
  ) {

    node.contents.forEach(
      (bubble, index) => {

        appendTreeNode(

          parent,

          bubble,

          [
            ...path,
            "contents",
            index
          ],

          depth + 1,

          `Bubble ${index + 1}`

        );

      }
    );

  }


  /* Box children */

  if (
    node.type === "box" &&
    Array.isArray(
      node.contents
    )
  ) {

    node.contents.forEach(
      (child, index) => {

        appendTreeNode(

          parent,

          child,

          [
            ...path,
            "contents",
            index
          ],

          depth + 1,

          `${index + 1}`

        );

      }
    );

  }

}


/* ============================================================
   PREVIEW
============================================================ */

function renderPreview() {

  const root =
    document.getElementById(
      "previewRoot"
    );


  root.innerHTML = "";


  if (
    flexModel.type ===
    "carousel"
  ) {

    const carousel =
      document.createElement(
        "div"
      );


    carousel.style.display =
      "flex";

    carousel.style.gap =
      "15px";


    carousel.style.alignItems =
      "flex-start";


    (
      flexModel.contents ||
      []
    ).forEach(
      (bubble, index) => {

        carousel.appendChild(

          renderPreviewBubble(

            bubble,

            [
              "contents",
              index
            ]

          )

        );

      }
    );


    root.appendChild(
      carousel
    );

  }

  else {

    root.appendChild(

      renderPreviewBubble(
        flexModel,
        []
      )

    );

  }

}


function renderPreviewBubble(
  bubble,
  path
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "flex-preview preview-element";


  makePreviewSelectable(
    card,
    path
  );


  if (
    bubble.hero
  ) {

    const hero =
      renderPreviewNode(

        bubble.hero,

        [
          ...path,
          "hero"
        ]

      );


    card.appendChild(
      hero
    );

  }


  [
    "header",
    "body",
    "footer"
  ].forEach(
    sectionName => {

      if (
        !bubble[
          sectionName
        ]
      ) {

        return;

      }


      const section =
        document.createElement(
          "div"
        );


      section.className =
        "preview-section";


      const node =
        renderPreviewNode(

          bubble[
            sectionName
          ],

          [
            ...path,
            sectionName
          ]

        );


      section.appendChild(
        node
      );


      card.appendChild(
        section
      );

    }
  );


  return card;

}


function renderPreviewNode(
  node,
  path
) {

  if (!node) {

    return document.createElement(
      "div"
    );

  }


  let el;


  /* ========================
     TEXT
  ======================== */

  if (
    node.type === "text"
  ) {

    el =
      document.createElement(
        "div"
      );


    el.textContent =
      node.text || "";


    el.style.whiteSpace =
      node.wrap === false
        ? "nowrap"
        : "pre-wrap";


    el.style.fontWeight =
      node.weight === "bold"
        ? "700"
        :
      node.weight === "regular"
        ? "400"
        :
      "400";


    el.style.fontSize =
      flexSizeToPx(
        node.size
      );


    el.style.color =
      node.color ||
      "#222222";


    el.style.textAlign =
      node.align ||
      "left";


    el.style.marginTop =
      marginToPx(
        node.margin
      );

  }


  /* ========================
     IMAGE
  ======================== */

  else if (
    node.type === "image"
  ) {

    el =
      document.createElement(
        "img"
      );


    el.src =
      node.url || "";


    el.style.display =
      "block";


    el.style.maxWidth =
      "100%";


    el.style.width =
      node.size === "full"
        ? "100%"
        : "auto";


    el.style.marginTop =
      marginToPx(
        node.margin
      );


    el.style.objectFit =
      node.aspectMode === "fit"
        ? "contain"
        : "cover";


    if (
      node.aspectRatio
    ) {

      const ratio =
        node.aspectRatio
          .split(":")
          .map(Number);


      if (
        ratio.length === 2 &&
        ratio[0] &&
        ratio[1]
      ) {

        el.style.aspectRatio =
          `${ratio[0]} / ${ratio[1]}`;

      }

    }

  }


  /* ========================
     BUTTON
  ======================== */

  else if (
    node.type === "button"
  ) {

    el =
      document.createElement(
        "button"
      );


    el.textContent =
      node.action?.label ||
      "Button";


    el.style.width =
      "100%";


    el.style.marginTop =
      marginToPx(
        node.margin
      );


    if (
      node.style ===
      "primary"
    ) {

      el.style.background =
        node.color ||
        "#06C755";

      el.style.color =
        "white";

    }

    else if (
      node.style ===
      "secondary"
    ) {

      el.style.background =
        node.color ||
        "#eeeeee";

      el.style.color =
        "#222";

    }

    else {

      el.style.background =
        "transparent";

      el.style.color =
        node.color ||
        "#0066cc";

    }

  }


  /* ========================
     BOX
  ======================== */

  else if (
    node.type === "box"
  ) {

    el =
      document.createElement(
        "div"
      );


    el.className =
      "preview-box";


    el.style.flexDirection =
      node.layout === "horizontal"
        ? "row"
        : "column";


    el.style.gap =
      spacingToPx(
        node.spacing
      );


    el.style.marginTop =
      marginToPx(
        node.margin
      );


    if (
      node.backgroundColor
    ) {

      el.style.background =
        node.backgroundColor;

    }


    if (
      node.cornerRadius
    ) {

      el.style.borderRadius =
        flexRadiusToPx(
          node.cornerRadius
        );

    }


    if (
      node.paddingAll
    ) {

      el.style.padding =
        spacingToPx(
          node.paddingAll
        );

    }


    (
      node.contents ||
      []
    ).forEach(
      (child, index) => {

        el.appendChild(

          renderPreviewNode(

            child,

            [
              ...path,
              "contents",
              index
            ]

          )

        );

      }
    );

  }


  /* ========================
     SEPARATOR
  ======================== */

  else if (
    node.type ===
    "separator"
  ) {

    el =
      document.createElement(
        "hr"
      );


    el.style.border =
      "0";


    el.style.borderTop =
      `1px solid ${
        node.color ||
        "#dddddd"
      }`;


    el.style.width =
      "100%";


    el.style.marginTop =
      marginToPx(
        node.margin
      );

  }


  /* ========================
     SPACER
  ======================== */

  else if (
    node.type === "spacer"
  ) {

    el =
      document.createElement(
        "div"
      );


    el.style.height =
      spacingToPx(
        node.size ||
        "md"
      );

  }


  else {

    el =
      document.createElement(
        "div"
      );


    el.textContent =
      `[${node.type || "unknown"}]`;

  }


  el.classList.add(
    "preview-element"
  );


  makePreviewSelectable(
    el,
    path
  );


  return el;

}


function makePreviewSelectable(
  el,
  path
) {

  if (
    pathEquals(
      selectedPath,
      path
    )
  ) {

    el.classList.add(
      "selected-element"
    );

  }


  el.onclick =
    event => {

      event.preventDefault();

      event.stopPropagation();


      selectedPath =
        [...path];


      renderAll(
        false
      );

    };

}

/* ============================================================
   PROPERTY UI HELPERS
============================================================ */

function addTextField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const input =
    document.createElement(
      "input"
    );


  input.value =
    value ?? "";


  input.oninput =
    () => onChange(
      input.value
    );


  wrapper.appendChild(
    input
  );


  root.appendChild(
    wrapper
  );

}


function addTextareaField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const input =
    document.createElement(
      "textarea"
    );


  input.rows = 4;

  input.value =
    value ?? "";


  input.oninput =
    () => onChange(
      input.value
    );


  wrapper.appendChild(
    input
  );


  root.appendChild(
    wrapper
  );

}


function addSelectField(
  root,
  labelText,
  value,
  options,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const select =
    document.createElement(
      "select"
    );


  options.forEach(
    optionValue => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        optionValue;


      option.textContent =
        optionValue ||
        "Default";


      if (
        String(value) ===
        String(optionValue)
      ) {

        option.selected =
          true;

      }


      select.appendChild(
        option
      );

    }
  );


  select.onchange =
    () => onChange(
      select.value
    );


  wrapper.appendChild(
    select
  );


  root.appendChild(
    wrapper
  );

}


function addColorField(
  root,
  labelText,
  value,
  onChange
) {

  const wrapper =
    createField(
      labelText
    );


  const group =
    document.createElement(
      "div"
    );


  group.style.display =
    "grid";

  group.style.gridTemplateColumns =
    "50px 1fr";

  group.style.gap =
    "7px";


  const color =
    document.createElement(
      "input"
    );


  color.type =
    "color";


  color.value =
    normalizeColor(
      value
    );


  const text =
    document.createElement(
      "input"
    );


  text.value =
    value;


  color.oninput =
    () => {

      text.value =
        color.value;

      onChange(
        color.value
      );

    };


  text.oninput =
    () => {

      if (
        /^#[0-9A-Fa-f]{6}$/.test(
          text.value
        )
      ) {

        color.value =
          text.value;

      }


      onChange(
        text.value
      );

    };


  group.appendChild(
    color
  );

  group.appendChild(
    text
  );


  wrapper.appendChild(
    group
  );


  root.appendChild(
    wrapper
  );

}


function addCheckboxField(
  root,
  labelText,
  checked,
  onChange
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "field";


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "checkbox";


  input.checked =
    checked;


  input.style.width =
    "auto";


  const label =
    document.createElement(
      "label"
    );


  label.style.display =
    "flex";

  label.style.alignItems =
    "center";

  label.style.gap =
    "8px";


  label.appendChild(
    input
  );


  label.appendChild(
    document.createTextNode(
      labelText
    )
  );


  input.onchange =
    () => onChange(
      input.checked
    );


  wrapper.appendChild(
    label
  );


  root.appendChild(
    wrapper
  );

}


function createField(
  labelText
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "field";


  const label =
    document.createElement(
      "label"
    );


  label.textContent =
    labelText;


  wrapper.appendChild(
    label
  );


  return wrapper;

}


/* ============================================================
   UPDATE PROPERTY
============================================================ */

function updateProperty(
  key,
  value
) {

  if (!commitJsonIfNeeded()) {
    return;
  }


  const node =
    getByPath(
      selectedPath
    );


  if (!node) {
    return;
  }


  if (
    value === ""
  ) {

    delete node[key];

  }

  else {

    node[key] =
      value;

  }


  afterModelChange();

}


function changeButtonActionType(
  node,
  type
) {

  const label =
    node.action?.label ||
    "Button";


  if (
    type === "uri"
  ) {

    node.action = {

      type: "uri",

      label,

      uri: "https://line.me"

    };

  }


  else if (
    type === "message"
  ) {

    node.action = {

      type: "message",

      label,

      text: "Hello"

    };

  }


  else {

    node.action = {

      type: "postback",

      label,

      data: "action=example"

    };

  }


  afterModelChange();

}


/* ============================================================
   ADD COMPONENT
============================================================ */

function addComponent(
  type
) {

  if (!commitJsonIfNeeded()) {
    return;
  }


  const targetPath =
    findNearestBoxPath(
      selectedPath
    );


  if (!targetPath) {

    showStatus(

      "Select a Box or an element inside a Box first.",

      "error"

    );

    return;

  }


  const box =
    getByPath(
      targetPath
    );


  if (
    !Array.isArray(
      box.contents
    )
  ) {

    box.contents = [];

  }


  const component =
    createComponent(
      type
    );


  box.contents.push(
    component
  );


  selectedPath = [

    ...targetPath,

    "contents",

    box.contents.length - 1

  ];


  afterModelChange();

}


function createComponent(
  type
) {

  switch (type) {

    case "text":

      return {

        type: "text",

        text: "New text",

        wrap: true,

        size: "md"

      };


    case "image":

      return {

        type: "image",

        url:
          "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",

        size: "full",

        aspectRatio: "20:13",

        aspectMode: "cover"

      };


    case "button":

      return {

        type: "button",

        style: "primary",

        color: "#06C755",

        action: {

          type: "uri",

          label: "Open",

          uri: "https://line.me"

        }

      };


    case "box":

      return {

        type: "box",

        layout: "vertical",

        spacing: "sm",

        contents: [

          {

            type: "text",

            text: "New Box",

            wrap: true

          }

        ]

      };


    case "separator":

      return {

        type: "separator",

        margin: "md"

      };


    case "spacer":

      return {

        type: "spacer",

        size: "md"

      };

  }

}


/* ============================================================
   ADD BUBBLE / CONVERT TO CAROUSEL
============================================================ */

function addBubble() {

  if (!commitJsonIfNeeded()) {
    return;
  }


  if (
    flexModel.type ===
    "bubble"
  ) {

    flexModel = {

      type: "carousel",

      contents: [

        deepClone(
          flexModel
        ),

        createDefaultBubble()

      ]

    };


    selectedPath = [

      "contents",

      1

    ];

  }


  else if (
    flexModel.type ===
    "carousel"
  ) {

    flexModel.contents.push(
      createDefaultBubble()
    );


    selectedPath = [

      "contents",

      flexModel.contents.length - 1

    ];

  }


  afterModelChange();

}


/* ============================================================
   FIND TARGET BOX
============================================================ */

function findNearestBoxPath(
  path
) {

  let current =
    [...path];


  while (
    current.length >= 0
  ) {

    const node =
      getByPath(
        current
      );


    if (
      node?.type === "box"
    ) {

      return current;

    }


    if (
      current.length === 0
    ) {

      break;

    }


    current.pop();

  }


  /* Bubble root */

  let bubblePath =
    findNearestBubblePath(
      path
    );


  if (bubblePath) {

    const bubble =
      getByPath(
        bubblePath
      );


    if (!bubble.body) {

      bubble.body = {

        type: "box",

        layout: "vertical",

        contents: []

      };

    }


    return [

      ...bubblePath,

      "body"

    ];

  }


  return null;

}


function findNearestBubblePath(
  path
) {

  let current =
    [...path];


  while (
    current.length >= 0
  ) {

    const node =
      getByPath(
        current
      );


    if (
      node?.type ===
      "bubble"
    ) {

      return current;

    }


    if (
      current.length === 0
    ) {

      break;

    }


    current.pop();

  }


  return null;

}


/* ============================================================
   REMOVE SELECTED
============================================================ */

function removeSelected() {

  if (!commitJsonIfNeeded()) {
    return;
  }


  if (
    selectedPath.length === 0
  ) {

    showStatus(
      "Cannot remove root.",
      "error"
    );

    return;

  }


  const info =
    getParentInfo(
      selectedPath
    );


  if (!info) {
    return;
  }


  /* Array item */

  if (
    Array.isArray(
      info.parent
    )
  ) {

    info.parent.splice(
      Number(
        info.key
      ),
      1
    );


    selectedPath =
      info.parentPath.slice(
        0,
        -1
      );

  }

  else {

    delete info.parent[
      info.key
    ];


    selectedPath =
      info.parentPath;

  }


  afterModelChange();

}


/* ============================================================
   DUPLICATE SELECTED
============================================================ */

function duplicateSelected() {

  if (!commitJsonIfNeeded()) {
    return;
  }


  if (
    selectedPath.length === 0
  ) {

    showStatus(
      "Select a component first.",
      "error"
    );

    return;

  }


  const info =
    getParentInfo(
      selectedPath
    );


  if (
    !info ||
    !Array.isArray(
      info.parent
    )
  ) {

    showStatus(

      "This element cannot be duplicated here.",

      "error"

    );

    return;

  }


  const index =
    Number(
      info.key
    );


  info.parent.splice(

    index + 1,

    0,

    deepClone(
      info.parent[index]
    )

  );


  selectedPath[
    selectedPath.length - 1
  ] =
    index + 1;


  afterModelChange();

}


/* ============================================================
   MOVE SELECTED
============================================================ */

function moveSelected(
  direction
) {

  if (!commitJsonIfNeeded()) {
    return;
  }


  const info =
    getParentInfo(
      selectedPath
    );


  if (
    !info ||
    !Array.isArray(
      info.parent
    )
  ) {

    return;

  }


  const index =
    Number(
      info.key
    );


  const next =
    index +
    direction;


  if (
    next < 0 ||
    next >=
      info.parent.length
  ) {

    return;

  }


  [
    info.parent[index],
    info.parent[next]
  ] = [

    info.parent[next],
    info.parent[index]

  ];


  selectedPath[
    selectedPath.length - 1
  ] =
    next;


  afterModelChange();

}


/* ============================================================
   SELECTED ELEMENT JSON
============================================================ */

function applyElementJson() {

  try {

    if (
      selectedPath.length === 0
    ) {

      throw new Error(
        "Use Full Flex JSON to replace root."
      );

    }


    const value =
      JSON.parse(

        document
          .getElementById(
            "elementJsonEditor"
          )
          .value

      );


    const info =
      getParentInfo(
        selectedPath
      );


    info.parent[
      info.key
    ] =
      value;


    afterModelChange();


    showStatus(
      "Element JSON applied.",
      "success"
    );

  }

  catch (error) {

    showStatus(

      "Element JSON error: " +
      error.message,

      "error"

    );

  }

}


/* ============================================================
   FULL JSON
============================================================ */

function syncFullJson() {

  document.getElementById(
    "jsonEditor"
  ).value =
    JSON.stringify(
      flexModel,
      null,
      2
    );


  jsonDirty =
    false;

}


function applyFullJson() {

  try {

    const parsed =
      JSON.parse(

        document
          .getElementById(
            "jsonEditor"
          )
          .value

      );


    validateFlex(
      parsed
    );


    flexModel =
      parsed;


    selectedPath =
      getDefaultSelectionPath();


    jsonDirty =
      false;


    renderAll();


    showStatus(
      "JSON applied to Visual Designer.",
      "success"
    );

  }

  catch (error) {

    showStatus(

      "JSON error: " +
      error.message,

      "error"

    );

  }

}


function formatFullJson() {

  try {

    const editor =
      document.getElementById(
        "jsonEditor"
      );


    const parsed =
      JSON.parse(
        editor.value
      );


    editor.value =
      JSON.stringify(
        parsed,
        null,
        2
      );


    showStatus(
      "JSON formatted.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      error.message,
      "error"
    );

  }

}


async function copyFullJson() {

  try {

    await navigator.clipboard.writeText(

      document
        .getElementById(
          "jsonEditor"
        )
        .value

    );


    showStatus(
      "JSON copied.",
      "success"
    );

  }

  catch {

    showStatus(
      "Unable to copy JSON.",
      "error"
    );

  }

}


/* ============================================================
   COMMIT RAW JSON
============================================================ */

function commitJsonIfNeeded() {

  if (!jsonDirty) {

    return true;

  }


  try {

    const parsed =
      JSON.parse(

        document
          .getElementById(
            "jsonEditor"
          )
          .value

      );


    validateFlex(
      parsed
    );


    flexModel =
      parsed;


    selectedPath =
      getDefaultSelectionPath();


    jsonDirty =
      false;


    return true;

  }

  catch (error) {

    showStatus(

      "Fix JSON first: " +
      error.message,

      "error"

    );


    return false;

  }

}


/* ============================================================
   VALIDATE
============================================================ */

function validateFlex(
  json
) {

  if (
    !json ||
    typeof json !== "object"
  ) {

    throw new Error(
      "Invalid Flex JSON."
    );

  }


  if (
    json.type !== "bubble" &&
    json.type !== "carousel"
  ) {

    throw new Error(

      'Root type must be "bubble" or "carousel".'

    );

  }


  if (
    json.type === "carousel" &&
    !Array.isArray(
      json.contents
    )
  ) {

    throw new Error(
      "Carousel must contain contents array."
    );

  }


  return true;

}


/* ============================================================
   MODEL CHANGE
============================================================ */

function afterModelChange() {

  jsonDirty =
    false;


  renderTree();

  renderPreview();

  renderProperties();

  syncFullJson();

}


/* ============================================================
   RENDER EVERYTHING
============================================================ */

function renderAll(
  syncJson = true
) {

  renderTree();

  renderPreview();

  renderProperties();


  if (syncJson) {

    syncFullJson();

  }

}


/* ============================================================
   DEFAULT SELECTION
============================================================ */

function getDefaultSelectionPath() {

  if (
    flexModel.type ===
    "bubble"
  ) {

    if (
      flexModel.body
    ) {

      return ["body"];

    }


    return [];

  }


  if (
    flexModel.type ===
    "carousel" &&
    flexModel.contents?.length
  ) {

    const first =
      flexModel.contents[0];


    if (
      first.body
    ) {

      return [
        "contents",
        0,
        "body"
      ];

    }


    return [
      "contents",
      0
    ];

  }


  return [];

}


/* ============================================================
   PREVIEW UTILITIES
============================================================ */

function flexSizeToPx(
  size
) {

  const map = {

    xxs: "10px",
    xs: "11px",
    sm: "13px",
    md: "15px",
    lg: "17px",
    xl: "20px",
    xxl: "24px",
    "3xl": "28px",
    "4xl": "32px",
    "5xl": "36px"

  };


  return map[size] ||
    "15px";

}


function spacingToPx(
  value
) {

  const map = {

    none: "0px",
    xs: "4px",
    sm: "8px",
    md: "12px",
    lg: "16px",
    xl: "20px",
    xxl: "28px"

  };


  return map[value] ||
    "0px";

}


function marginToPx(
  value
) {

  return spacingToPx(
    value
  );

}


function flexRadiusToPx(
  value
) {

  const map = {

    none: "0px",
    xs: "4px",
    sm: "7px",
    md: "10px",
    lg: "14px",
    xl: "20px",
    xxl: "30px"

  };


  return map[value] ||
    "0px";

}


function normalizeColor(
  color
) {

  if (
    /^#[0-9A-Fa-f]{6}$/.test(
      color
    )
  ) {

    return color;

  }


  return "#ffffff";

}


/* ============================================================
   STATUS
============================================================ */

let statusTimer;


function showStatus(
  message,
  type = ""
) {

  clearTimeout(
    statusTimer
  );


  const el =
    document.getElementById(
      "status"
    );


  el.textContent =
    message;


  el.className =
    "status " +
    type;


  el.style.display =
    "block";


  statusTimer =
    setTimeout(
      () => {

        el.style.display =
          "none";

      },
      3500
    );

}


/* ============================================================
   START
============================================================ */

renderAll();

init();

</script>
